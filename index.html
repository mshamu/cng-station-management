<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Gas CNG · Digital Attendant Prototype</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B7A3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Energy Station">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --green:#1B7A3D; --green-d:#14532D; --green-l:#E6F4EA; --green-ll:#F4FAF6;
    --amber:#B45309; --amber-l:#FEF3C7; --red:#B91C1C; --red-l:#FEE2E2;
    --ink:#1F2937; --muted:#6B7280; --line:#E5E7EB; --white:#fff;
    --blue:#1D4E89;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0f172a;color:var(--ink);
    display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start;padding:28px 14px;min-height:100vh}
  .stage{display:flex;flex-direction:column;align-items:center;gap:14px}
  .stage h2{color:#e2e8f0;font-size:14px;font-weight:600;margin:0;letter-spacing:.3px}
  .stage p.sub{color:#94a3b8;font-size:12px;margin:0 0 2px;max-width:360px;text-align:center}

  /* phone frame */
  .phone{width:378px;height:772px;background:#000;border-radius:44px;padding:12px;box-shadow:0 30px 70px rgba(0,0,0,.55);position:relative}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#000;border-radius:0 0 18px 18px;z-index:40}
  .screen{width:100%;height:100%;background:#F7F9F8;border-radius:33px;overflow:hidden;position:relative;display:flex;flex-direction:column}

  /* app chrome */
  .topbar{background:linear-gradient(135deg,var(--green) 0%,var(--green-d) 100%);color:#fff;padding:34px 18px 14px;flex-shrink:0}
  .topbar .row{display:flex;justify-content:space-between;align-items:center}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
  .logo{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--green);display:grid;place-items:center;font-weight:800;font-size:14px}
  .who{font-size:11px;opacity:.9;text-align:right;line-height:1.35}
  .who b{display:block;font-size:12px}
  .shiftchip{margin-top:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:12px;
    padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
  .shiftchip .dot{width:8px;height:8px;border-radius:50%;background:#86efac;display:inline-block;margin-right:6px;box-shadow:0 0 0 3px rgba(134,239,172,.3)}

  .body{flex:1;overflow-y:auto;padding:16px 16px 90px}
  .body::-webkit-scrollbar{width:0}

  /* nav */
  .nav{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;
    padding:9px 6px 16px;flex-shrink:0;z-index:30}
  .nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;flex:1}
  .nav button .ic{font-size:19px;line-height:1}
  .nav button.on{color:var(--green)}
  .fab{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;
    display:grid;place-items:center;font-size:26px;margin-top:-24px;box-shadow:0 8px 18px rgba(27,122,61,.5);border:3px solid #fff}

  /* generic */
  h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:4px 0 10px;font-weight:700}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.primary{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;box-shadow:0 6px 14px rgba(27,122,61,.35)}
  .btn.dark{background:var(--green-d);color:#fff}
  .btn.ghost{background:#fff;color:var(--green);border:2px solid var(--green)}
  .btn.amber{background:var(--amber);color:#fff}
  .btn.red{background:#fff;color:var(--red);border:2px solid var(--red)}
  .btn.sm{padding:11px;font-size:14px;border-radius:12px}
  .btn:active{transform:scale(.98)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  label.fl{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:2px 0 7px;text-transform:uppercase;letter-spacing:.4px}
  input.big{width:100%;border:2px solid var(--line);border-radius:13px;padding:14px;font-size:22px;font-weight:700;color:var(--ink);text-align:center;outline:none}
  input.big:focus{border-color:var(--green)}
  input.txt{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:15px;outline:none}
  input.txt:focus{border-color:var(--green)}
  select.sel{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px;font-size:15px;font-weight:600;color:var(--ink);background:#fff;outline:none;-webkit-appearance:none;appearance:none}
  select.sel:focus{border-color:var(--green)}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:13px;padding:14px 8px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .seg button .ic{font-size:22px}
  .seg button.on{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:11px;padding:12px 4px;font-weight:700;font-size:14px;color:var(--muted);text-align:center;cursor:pointer}
  .chip.on{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
  .muted{color:var(--muted)}.tiny{font-size:11px}.center{text-align:center}
  .amt{font-size:34px;font-weight:800;color:var(--green-d);text-align:center;letter-spacing:-.5px}
  .rowb{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--green-ll);font-size:14px}
  .rowb:last-child{border-bottom:0}
  .rowb b{font-weight:700}
  .pill{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
  .pill.ok{background:var(--green-l);color:var(--green-d)}
  .pill.warn{background:var(--amber-l);color:var(--amber)}
  .pill.bad{background:var(--red-l);color:var(--red)}

  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}
  .kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
  .kpi .v{font-size:22px;font-weight:800;color:var(--green-d);margin-top:3px;line-height:1}
  .kpi .u{font-size:11px;color:var(--muted);font-weight:600}
  .kpi.wide{grid-column:1/3;background:linear-gradient(135deg,var(--green),var(--green-d));border:0;color:#fff}
  .kpi.wide .k{color:rgba(255,255,255,.85)}.kpi.wide .v{color:#fff;font-size:28px}.kpi.wide .u{color:rgba(255,255,255,.85)}

  /* camera */
  .cam{background:#111827;border-radius:16px;height:210px;position:relative;overflow:hidden;display:grid;place-items:center;margin-bottom:12px}
  .cam .frame{position:absolute;inset:26px 30px;border:2px dashed rgba(255,255,255,.55);border-radius:10px}
  .cam .plate{background:#f8fafc;border:3px solid #111;border-radius:7px;padding:8px 16px;font-weight:800;font-size:26px;letter-spacing:2px;color:#111;box-shadow:0 4px 10px rgba(0,0,0,.4);transform:rotate(-6deg)}
  .cam .hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#cbd5e1;font-size:11px}
  .scan{position:absolute;left:30px;right:30px;height:2px;background:#86efac;box-shadow:0 0 10px #86efac;top:26px;animation:scan 1.1s ease-in-out infinite}
  @keyframes scan{0%{top:26px}50%{top:180px}100%{top:26px}}

  .txn{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--green-ll)}
  .txn:last-child{border-bottom:0}
  .txn .ico{width:38px;height:38px;border-radius:10px;background:var(--green-l);display:grid;place-items:center;font-size:19px;flex-shrink:0}
  .txn .mid{flex:1;min-width:0}
  .txn .mid b{font-size:14px}
  .txn .mid .m{font-size:11px;color:var(--muted)}
  .txn .amt2{font-weight:800;color:var(--green-d);font-size:14px;text-align:right}
  .txn .amt2 .m{font-size:10px;color:var(--muted);font-weight:600}

  .toast{position:absolute;left:14px;right:14px;bottom:78px;background:var(--green-d);color:#fff;border-radius:14px;padding:13px 15px;
    font-size:13px;font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.35);z-index:50;display:flex;gap:10px;align-items:center;
    opacity:0;transform:translateY(12px);transition:.28s;pointer-events:none}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast .big{font-size:20px}

  .banner{border-radius:13px;padding:12px 13px;font-size:13px;margin-bottom:12px;display:flex;gap:9px;align-items:flex-start}
  .banner.warn{background:var(--amber-l);color:#7c2d12;border:1px solid #fcd34d}
  .banner.ok{background:var(--green-l);color:var(--green-d);border:1px solid #bbf7d0}
  .banner .b{font-size:18px;line-height:1}
  .kv{font-size:13px;display:flex;justify-content:space-between;padding:4px 0}
  .kv .l{color:var(--muted)}
  .hidden{display:none}
  .stepdots{display:flex;gap:5px;justify-content:center;margin:0 0 12px}
  .stepdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .stepdots i.on{background:var(--green);width:20px;border-radius:5px}

  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .legend{max-width:380px;color:#94a3b8;font-size:11px;text-align:center;line-height:1.6}
  .legend b{color:#cbd5e1}
  .camimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0b1220;border-radius:16px}
  .thumb{width:46px;height:46px;border-radius:9px;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}

  /* ---- phone / small screens: run full-screen like a real app ---- */
  @media (max-width:820px){
    body{padding:0;gap:0;background:var(--green-d);display:block}
    .stage{width:100%;gap:0;margin-bottom:0}
    .stage h2{background:var(--green-d);color:#dcfce7;width:100%;padding:9px 14px;font-size:12px;text-align:center;box-sizing:border-box}
    .stage p.sub,.legend{display:none}
    .phone{width:100%;height:calc(100vh - 34px);min-height:560px;border-radius:0;padding:0;box-shadow:none}
    .notch{display:none}
    .screen{border-radius:0;height:100%}
    .topbar{padding-top:16px}
    .body{padding-bottom:96px}
  }
  @media (max-width:820px) and (display-mode:standalone){
    .phone{height:100vh}
  }

  /* Responsive fixes */
  :root { --phone-w: 378px; }
  body { padding: 28px 14px; min-height: 100vh; }
  .stage { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .phone { width: min(92vw, var(--phone-w)); max-width: 100%; height: min(88vh, 772px); min-height: 620px; transition: width 0.2s ease, height 0.2s ease; }
  .screen { min-height: 100%; }
  @media (max-width: 820px) {
    body { padding: 0; background: var(--green-d); }
    .stage { width: 100%; gap: 0; }
    .stage h2 { width: 100%; padding: 9px 14px; box-sizing: border-box; }
    .phone { width: 100%; height: calc(100dvh - 34px); min-height: 560px; border-radius: 0; padding: 0; box-shadow: none; }
    .screen { border-radius: 0; height: 100%; }
    .topbar { padding-top: 16px; }
    .body { padding: 12px 12px 96px; }
  }
  @media (max-width: 560px) {
    .body { padding: 12px 10px 90px; }
    .card { padding: 12px; border-radius: 12px; }
    .btn { padding: 13px 10px; font-size: 14px; }
    .btn.sm { padding: 11px 8px; font-size: 13px; }
    .kpis { grid-template-columns: 1fr 1fr; }
    .grid2, .grid4 { grid-template-columns: 1fr; }
    .seg { flex-direction: column; }
    .nav { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .nav button { font-size: 9px; }
    .topbar .row { gap: 8px; }
    .brand { font-size: 13px; }
    .who { font-size: 10px; }
    .amt { font-size: 28px; }
    input.big { font-size: 20px; }
  }
  @media (max-width: 420px) {
    .phone { width: 100%; height: 100dvh; min-height: 100dvh; border-radius: 0; }
    .screen { border-radius: 0; }
    .topbar { padding: 18px 12px 12px; }
    .body { padding: 10px 8px 86px; }
    .kpis { grid-template-columns: 1fr; }
    .card { padding: 10px; }
    .btn { font-size: 13px; }
  }
</style>
</head>
<body>

<!-- ============ SINGLE ROLE-GATED APP ============ -->
<div class="stage">
  <h2 id="stageCap">Green Gas CNG</h2>
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="topbar" id="topbar"><!-- role-based header injected --></div>

      <div class="body" id="appBody"><!-- screens injected --></div>

      <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(event)">

      <div class="nav" id="navbar"><!-- role-based nav injected --></div>

      <div class="toast" id="toast"></div>

</div>

<script>

/* ================= PLATFORM / MULTI-TENANT CONFIG ================= */
let PLATFORM_NAME = 'Energy Station Platform';   // configurable, not branded to one company
// Companies (tenants) — each fully isolated. CNG is Version 1; energyTypes is configurable.
const COMPANIES = [
  { id:'C001', name:'Green Gas CNG', trading:'Green Gas', country:'Tanzania', currency:'TZS',
    color:'#1B7A3D', colorD:'#14532D', energyTypes:['CNG'], pricePerKg:1550, pointsPerKg:1,
    stations:[ {id:'S01',code:'GG-MAIN',name:'Main Station',status:'Active',color:'#1B7A3D',colorDark:'#14532D'},
               {id:'S02',code:'GG-MIKO',name:'Mikocheni',status:'Active',color:'#0F766E',colorDark:'#115E59'} ],
    licences:[ {name:'EWURA Operating Licence', number:'EWURA/CNG/2024/012', issuer:'EWURA', issued:'2024-01-15', expiry:'2026-12-31', fileName:'ewura_licence.pdf', fileData:null},
                {name:'Fire Safety Certificate', number:'FIRE/2025/220', issuer:'Fire & Rescue Force', issued:'2025-03-01', expiry:'2026-03-01', fileName:'fire_cert.pdf', fileData:null},
                {name:'Meter Calibration Certificate', number:'WMA/2025/44', issuer:'Weights & Measures Agency', issued:'2025-06-01', expiry:'2026-06-01', fileName:'meter_cal.pdf', fileData:null},
                {name:'Business Licence', number:'BRELA/2024/9981', issuer:'BRELA', issued:'2024-01-10', expiry:'2027-01-10', fileName:'', fileData:null} ] },
  { id:'C002', name:'BlueFuel Energy', trading:'BlueFuel', country:'Tanzania', currency:'TZS',
    color:'#1D4E89', colorD:'#0f2f57', energyTypes:['CNG','LNG'], pricePerKg:1600, pointsPerKg:2,
    stations:[ {id:'S01',code:'BF-DOD',name:'Dodoma 01',status:'Active',color:'#1D4E89',colorDark:'#0f2f57'} ],
    licences:[ {name:'EWURA Operating Licence', number:'EWURA/CNG/2025/077', issuer:'EWURA', issued:'2025-02-01', expiry:'2027-02-01', fileName:'', fileData:null} ] }
];
function companyById(id){ return COMPANIES.find(c=>c.id===id)||COMPANIES[0]; }
function mixWithWhite(hex, ratio) {
  hex = hex.replace('#', '');
  const num = parseInt(hex, 16);
  const r = Math.round(((num >> 16) & 255) * ratio + 255 * (1 - ratio));
  const g = Math.round(((num >> 8) & 255) * ratio + 255 * (1 - ratio));
  const b = Math.round((num & 255) * ratio + 255 * (1 - ratio));
  return `rgb(${r}, ${g}, ${b})`;
}
function shadeColor(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  const amt = Math.round(2.55 * percent);
  const r = Math.min(255, Math.max(0, (num >> 16) + amt));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amt));
  const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
  return '#' + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function applyStationTheme(station) {
  const active = station || state.station;
  const color = active?.color || state.company?.color || '#1B7A3D';
  const dark = active?.colorDark || state.company?.colorD || '#14532D';
  document.documentElement.style.setProperty('--green', color);
  document.documentElement.style.setProperty('--green-d', dark);
  document.documentElement.style.setProperty('--green-l', mixWithWhite(color, 0.88));
  document.documentElement.style.setProperty('--green-ll', mixWithWhite(color, 0.96));
  const tb = document.getElementById('topbar');
  if (tb) tb.style.background = `linear-gradient(135deg, ${color} 0%, ${dark} 100%)`;
}
// ---- SaaS subscription plans (monthly, TZS) ----
const PLANS=[
  {id:'trial',name:'Free Trial (14 days)',monthly:0,seats:5,stations:1,tag:'Try it'},
  {id:'standard',name:'Standard',monthly:250000,seats:15,stations:2,tag:'Single station'},
  {id:'pro',name:'Pro',monthly:600000,seats:50,stations:10,tag:'Growing operator'},
  {id:'enterprise',name:'Enterprise',monthly:0,seats:9999,stations:9999,custom:true,tag:'Custom / contact us'}
];
function planById(id){ return PLANS.find(p=>p.id===id)||PLANS[0]; }
function subDaysLeft(c){ const s=c&&c.subscription; if(!s||!s.trialEndsOn)return null; return Math.ceil((new Date(s.trialEndsOn)-new Date())/864e5); }
function subActive(c){ c=c||state.company; if(!c||!c.subscription)return true; const s=c.subscription; if(s.status==='Active')return true; if(s.status==='Trial'){ const d=subDaysLeft(c); return d===null || d>0; } return false; }
(function seedSubs(){ const now=new Date(); const trialEnd=new Date(now.getTime()+14*864e5).toISOString().slice(0,10);
  COMPANIES.forEach(c=>{ if(!c.subscription) c.subscription={plan:'trial',status:'Trial',trialEndsOn:trialEnd,monthly:0,since:now.toISOString().slice(0,10)}; });
  companyById('C001').subscription={plan:'pro',status:'Active',trialEndsOn:'',monthly:600000,since:'2026-01-01'};
  companyById('C002').subscription={plan:'trial',status:'Trial',trialEndsOn:trialEnd,monthly:0,since:now.toISOString().slice(0,10)};
})();
function price(){ return state.company?state.company.pricePerKg:1550; }
function pts(){ return state.company?state.company.pointsPerKg:1; }
function cur(){ return state.company?state.company.currency:'TZS'; }
// Platform module catalog (§58) — Active modules map to built screens; others are Version-1 roadmap
const MODULES = [
  {k:'ops',name:'Operations',icon:'🛠️',status:'Active'},{k:'gas',name:'Gas & Reconciliation',icon:'🛢️',status:'Active'},
  {k:'sales',name:'Sales & Dispensing',icon:'⛽',status:'Active'},{k:'customers',name:'Customers',icon:'👥',status:'Active'},
  {k:'loyalty',name:'Loyalty',icon:'⭐',status:'Active'},{k:'care',name:'Customer Care',icon:'📞',status:'Planned'},
  {k:'maint',name:'Maintenance',icon:'🔧',status:'Planned'},{k:'inv',name:'Inventory',icon:'📦',status:'Planned'},
  {k:'hse',name:'HSE & Safety',icon:'🦺',status:'Planned'},{k:'comp',name:'Compliance',icon:'📜',status:'Planned'},
  {k:'staff',name:'Staff & Shifts',icon:'🧑',status:'Active'},{k:'fin',name:'Finance',icon:'💰',status:'Active'},
  {k:'inc',name:'Incidents',icon:'⚠️',status:'Planned'},{k:'iot',name:'IoT / Equipment',icon:'📡',status:'Planned'},
  {k:'analytics',name:'Analytics',icon:'📈',status:'Active'},{k:'reports',name:'Reports',icon:'📊',status:'Active'},
  {k:'recon',name:'Reconciliations',icon:'🧮',status:'Active'},{k:'settings',name:'Settings',icon:'⚙️',status:'Active'}
];

/* ================= STATION MASTER DATA ================= */
const ATTENDANTS = [
  'Salha Mohamed Duge','Mary Aloyce Shio','Magreth Selemani Adamu','Sunday Alfred Mmanda',
  'Rajabu Shija Rajabu','Rashid Haji Simtitu','Swaumu Abubakari Kidindi','Beatrice Nasiph Kinyau',
  'Pius Maberi Phares','Johnson Noel Koroto'
];
const SHIFTS = [
  {name:'Day',   time:'08:00 – 18:30', start:'08:00', end:'18:30'},
  {name:'Night', time:'18:30 – 08:00', start:'18:30', end:'08:00'}
];
const STATION_MANAGER = 'Erick Hussein Mshamu';
const MANAGER_PIN = '1234';

/* ================= TRANSACTION MODEL + SEED ================= */
function buildRec(o){
  const comp = companyById(o.companyId||'C001');
  const type = o.type || classify(o.plate) || 'Four-Wheeler';
  const denied = !!o.denied;
  const industrial = o.mode==='Industrial';
  const kg = denied?0:(industrial?+Math.max(0,(+o.meterEnd||0)-(+o.meterStart||0)).toFixed(2):(+o.kg||0));
  const unit = (industrial && +o.negPrice>0)?+o.negPrice:comp.pricePerKg;
  const member = isThree(type) && (o.bajajStatus==='Member' || o.bajajType==='TVS King Bajaj');
  const loyaltyStatus = member?'Member':'Non-member';
  const membershipId = member ? (o.membershipId||'') : '';
  const points = (member && !denied && permitOK(o.permit)) ? +(kg*comp.pointsPerKg).toFixed(2) : 0;
  const source = o.source || (industrial?'Bulk Post':(o.rfid?'RFID':'Dispenser'));
  const txType = o.txType || (industrial?'Bulk CNG':'Retail CNG');
  state.receiptSeq = (state.receiptSeq||1000)+1; const receiptNo='RCP-'+state.receiptSeq;
  const payStatus = denied?'—':(o.pay==='Account (Credit)'?'Pending':(o.paymentStatus||'Received'));
  const vfdStatus = denied?'—':((state.integrations&&state.integrations['VFD / Fiscal']==='Online')?'Fiscalized':'Pending');
  const posRef = denied?'':((state.integrations&&state.integrations.POS==='Online')?'POS-'+state.receiptSeq:'');
  return {
    source, txType, rfid:o.rfid||'', paymentStatus:payStatus, posRef, vfdStatus, receiptNo,
    companyId:comp.id, stationId:o.stationId||'S01', tenantId:comp.id,
    id:comp.id+'-'+(o.stationId||'S01')+'-'+(o.date||state.shiftDate).replace(/-/g,'')+'-'+String(state.seq).padStart(4,'0'),
    date:o.date, time:o.time, attendant:o.att, shift:o.shift, shiftStart:(SHIFTS.find(s=>s.name===o.shift)||SHIFTS[0]).start,
    mode:industrial?'Industrial':'Retail', meterStart:(+o.meterStart||null), meterEnd:(+o.meterEnd||null),
    pressure:o.pressure||'', temperature:o.temperature||'', negotiated:(industrial && unit!==comp.pricePerKg),
    customerAccount:o.customerAccount||'', trailerId:o.trailerId||'',
    photos:o.photos||[], confirmed:!!o.confirmed, confirmedBy:o.confirmedBy||'',
    plate:o.plate, type,
    driver:o.driver||'', phone:o.phone||'',
    bajajStatus:isThree(type)?(o.bajajStatus||''):'', bajajType:isThree(type)?(o.bajajType||''):'',
    loyaltyStatus, membershipId, points,
    kg, unitPrice:unit, amount:Math.round(kg*unit),
    permit:o.permit||'Active', denied,
    reason:denied?(o.reason||'Not refilled'):'', remarks:o.remarks||'',
    pay:denied?'—':o.pay, provider:(o.pay==='Mobile Money')?(o.prov||'M-Pesa'):'',
    nozzle:denied?'—':(o.noz||'Nozzle 1'), method:o.method||'ANPR/OCR', conf:o.conf||0.9, photo:(o.photos&&o.photos[0])||o.photo||null, status:'Completed',
    syncStatus:o.sync||SYNC.SYNCED, syncAt:o.syncAt||((o.date||TODAY)+' '+(o.time||''))
  };
}

function metrics(arr){
  const comp=completed(arr);
  const refilled=comp.filter(x=>!x.denied);
  const denied=comp.filter(x=>x.denied);
  const tw=refilled.filter(x=>isThree(x.type)), fw=refilled.filter(x=>!isThree(x.type));
  const members=refilled.filter(isMember);
  const memberIds=new Set(members.map(x=>x.membershipId||x.plate));
  return {
    total:comp.length, refilled, denied,
    n:refilled.length, kg:sum(refilled,x=>x.kg), sales:sum(refilled,x=>x.amount), unique:uniq(refilled),
    avgKg:refilled.length?sum(refilled,x=>x.kg)/refilled.length:0,
    avgVal:refilled.length?sum(refilled,x=>x.amount)/refilled.length:0,
    twN:tw.length,twU:uniq(tw),twKg:sum(tw,x=>x.kg),twSales:sum(tw,x=>x.amount),
    fwN:fw.length,fwU:uniq(fw),fwKg:sum(fw,x=>x.kg),fwSales:sum(fw,x=>x.amount),
    deniedN:denied.length, deniedTW:denied.filter(x=>isThree(x.type)).length, deniedFW:denied.filter(x=>!isThree(x.type)).length,
    cash:sum(refilled.filter(x=>x.pay==='Cash'),x=>x.amount),
    mobile:sum(refilled.filter(x=>x.pay==='Mobile Money'),x=>x.amount),
    membersServed:memberIds.size, pointsAwarded:sum(refilled,x=>x.points),
    tvsN:refilled.filter(x=>x.bajajType==='TVS King Bajaj').length,
    otherN:refilled.filter(x=>x.bajajType==='Other Bajaj').length,
    permitOKn:comp.filter(x=>permitOK(x.permit)).length,
    permitIssueN:comp.filter(x=>!permitOK(x.permit)).length
  };
}

/* ---- Synchronization engine (Attendant → central store → Manager) ---- */
function nowStamp(){ return state.shiftDate+' '+clock(); }
function commitToCentral(rec){ rec.syncStatus=SYNC.SYNCED; rec.syncAt=nowStamp(); state.central.lastSync=rec.syncAt; state.central.lastRec=rec; bumpData(); uiSyncTick(rec); }
function scheduleSync(rec){
  setTimeout(()=>{ rec.syncStatus=SYNC.SYNCING; uiSyncTick(rec);
    setTimeout(()=>{
      if(Math.random()<0.12){ rec.syncStatus=SYNC.FAILED; bumpData(); uiSyncTick(rec);
        setTimeout(()=>{ commitToCentral(rec); }, 1600);
      } else { commitToCentral(rec); }
    }, 800);
  }, 700);
}
function uiSyncTick(rec){
  if($('#succSync_'+rec.id)) $('#succSync_'+rec.id).innerHTML=syncBadge(rec.syncStatus);
  if(state.role==='attendant' && state.view==='list') renderList();
  if(state.role==='manager' && $('#syncPanel')) $('#syncPanel').innerHTML=syncPanelHTML();
}
function syncCounts(){ const c={}; Object.values(SYNC).forEach(s=>c[s]=0); scopeTxns().forEach(x=>{ c[x.syncStatus]=(c[x.syncStatus]||0)+1; }); return c; }
function activeAttendants(){ return new Set(completed(scopeTxns()).map(x=>x.attendant)).size; }
function syncPanelHTML(){ const c=syncCounts(); const pending=(c[SYNC.PENDING]||0)+(c[SYNC.SYNCING]||0); const last=state.central.lastRec; const failed=c[SYNC.FAILED]||0;
  return `<div class="rowb"><span>Connection</span><b><span class="pill ok">🟢 Connected</span></b></div>
    <div class="rowb"><span>Active attendants</span><b>${activeAttendants()}</b></div>
    <div class="rowb"><span>Last successful sync</span><b>${state.central.lastSync||'—'}</b></div>
    <div class="rowb"><span>Transactions received</span><b>${c[SYNC.SYNCED]||0}</b></div>
    <div class="rowb"><span>Pending / synchronizing</span><b style="color:var(--amber)">${pending}</b></div>
    <div class="rowb"><span>Failed synchronization</span><b style="color:var(--red)">${failed}</b></div>
    <div class="rowb"><span>Last transaction received</span><b>${last?last.id+' · '+last.attendant.split(' ')[0]+' · '+last.time:'—'}</b></div>
    <div class="rowb"><span>Reconciliation</span><b>${pending+failed===0?'<span class="pill ok">✓ In sync</span>':'<span class="pill warn">'+(pending+failed)+' awaiting</span>'}</b></div>`;
}

/* ---- Live Manager Dashboard engine ---- */
function bumpData(){ state.dataVersion++; }
function startMgrLive(){ stopMgrLive(); state.mgrTimer=setInterval(()=>{
    if(state.role!=='manager') return;
    const ls=$('#liveStamp'); if(ls) ls.textContent='System Status: 🟢 Live · Connected · '+clock();
    const typing = document.activeElement && document.activeElement.id==='mgrSearch';
    if(state.dataVersion!==state.lastRenderVersion && !typing){ renderMgr(); }
  }, SYNC_INTERVAL_MS); }
function stopMgrLive(){ if(state.mgrTimer){ clearInterval(state.mgrTimer); state.mgrTimer=null; } }

/* ---- Manual backup: genuine station-wide synchronization (not a page refresh) ---- */
function syncAllData(){
  toast('🔄 Synchronizing all data across all attendants…');
  const scope=scopeTxns();
  let n=0; scope.forEach(x=>{ if(x.syncStatus!==SYNC.SYNCED){ x.syncStatus=SYNC.SYNCED; x.syncAt=nowStamp(); n++; } });
  const last=scope[scope.length-1]; if(last){ state.central.lastSync=nowStamp(); state.central.lastRec=last; }
  bumpData(); renderMgr();
  toast('✓ Synchronized '+completed(scope).length+' transactions across '+activeAttendants()+' attendants'+(n?(' · '+n+' reconciled'):''));
}

}

function registerCompany(){
  const name=($('#regName')?$('#regName').value:'').trim();
  const station=($('#regStation')?$('#regStation').value:'').trim();
  if(!name){ toast('⚠️ Enter the company name'); return; }
  if(!station){ toast('⚠️ Enter the first station name'); return; }
  const energy=Array.from(document.querySelectorAll('#regEnergy input:checked')).map(i=>i.value);
  const id=nextCompanyId();
  const pal=BRAND_PALETTE[(COMPANIES.length)%BRAND_PALETTE.length];
  const initials=name.split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase();
  const code=(($('#regCode')&&$('#regCode').value.trim())|| (initials+'-01')).toUpperCase();
  const comp={ id, name, trading:($('#regTrading')&&$('#regTrading').value.trim())||name,
    country:($('#regCountry')&&$('#regCountry').value.trim())||'Tanzania',
    currency:($('#regCurrency')&&$('#regCurrency').value.trim())||'TZS',
    color:pal[0], colorD:pal[1], energyTypes:energy.length?energy:['CNG'],
    pricePerKg:+($('#regPrice')&&$('#regPrice').value)||1550, pointsPerKg:+($('#regPoints')&&$('#regPoints').value)||1,
    stations:[{id:'S01',code,name:station,status:'Active',color:pal[0],colorDark:pal[1]}], licences:[],
    subscription:{plan:'trial',status:'Trial',trialEndsOn:new Date(Date.now()+14*864e5).toISOString().slice(0,10),monthly:0,since:new Date().toISOString().slice(0,10)} };
  COMPANIES.push(comp);
  state._pickCompany=id;
  toast('✓ '+name+' registered · Tenant '+id);
  renderTenantPicker();
}
function enterTenant(){
  state.company=companyById(state._pickCompany);
  const sid=$('#pickStation')?$('#pickStation').value:state.company.stations[0].id;
  state.station=state.company.stations.find(s=>s.id===sid)||state.company.stations[0];
  applyStationTheme(state.station);
  renderLogin();
}

function updateStationColor(stationId, colorHex) {
  const c = state.company || COMPANIES[0];
  const station = c.stations.find(s => s.id === stationId);
  if (!station) return;
  station.color = colorHex;
  station.colorDark = shadeColor(colorHex, -18);
  if (state.station && state.station.id === stationId) {
    state.station = station;
    applyStationTheme(station);
  }
  renderSettings();
}

function licStatus(expiry){ if(!expiry) return '<span class="pill">—</span>'; const days=Math.round((new Date(expiry)-new Date())/86400000);
  if(days<0) return '<span class="pill bad">Expired</span>'; if(days<=30) return '<span class="pill warn">'+days+'d left</span>'; if(days<=90) return '<span class="pill warn">'+Math.round(days/30)+'m left</span>'; return '<span class="pill ok">Valid</span>'; }
function addLicence(){ const c=state.company; if(!c){ toast('Select a company first'); return; }
  const name=($('#licName')&&$('#licName').value.trim())||''; if(!name){ toast('⚠️ Enter the licence name'); return; }
  const lic={ name, number:($('#licNumber')&&$('#licNumber').value.trim())||'', issuer:($('#licIssuer')&&$('#licIssuer').value.trim())||'', issued:($('#licIssue')&&$('#licIssue').value)||'', expiry:($('#licExpiry')&&$('#licExpiry').value)||'', fileName:'', fileData:null };
  c.licences=c.licences||[];
  const fi=$('#licFile'); const f=fi&&fi.files&&fi.files[0];
  if(f){ lic.fileName=f.name; const rd=new FileReader(); rd.onload=()=>{ lic.fileData=rd.result; c.licences.push(lic); toast('✓ '+name+' uploaded'); renderSettings(); }; rd.readAsDataURL(f); }
  else { c.licences.push(lic); toast('✓ '+name+' added (attach a file later)'); renderSettings(); }
}

  </div>`;
  setTimeout(()=>{const u=$('#loginUser');if(u)u.focus();},60);

function doLogin(){ const un=($('#loginUser')?$('#loginUser').value:'').trim(); const pw=($('#loginPass')?$('#loginPass').value:''); const msg=$('#loginMsg');
  const u=findUser(un);
  if(!u){ state.loginFail++; if(msg)msg.innerHTML='<span style="color:var(--red)">Invalid username or password</span>'; return; }
  if(u.status!=='Active'){ if(msg)msg.innerHTML='<span style="color:var(--red)">Account is inactive — contact your manager</span>'; return; }
  if(u.passwordHash!==hashPw(pw)){ state.loginFail++; if(msg)msg.innerHTML='<span style="color:var(--red)">Invalid username or password'+(state.loginFail>=3?' · repeated failures are being monitored':'')+'</span>'; return; }
  state.loginFail=0; u.lastLogin=state.shiftDate+' '+clock(); state.currentUser=u;
  if(u.mustChange){ renderChangePassword(); return; }
  routeUser();
}
function routeUser(){ const u=state.currentUser; if(!u)return renderLogin();
  if(!subActive(state.company)){ state.role=(u.role==='Administrator')?'admin':(u.role==='Manager'?'manager':'attendant'); refreshTop(); return renderPaywall(); }
  if(u.role==='Attendant'){ state.role='attendant'; state.attendant=u.fullName; refreshTop(); renderStart(); }
  else if(u.role==='Manager'){ state.role='manager'; refreshTop(); $('#navbar').innerHTML=managerNavHTML(); renderMgr(); }
  else { state.role='admin'; refreshTop(); renderAdmin(); }
}

function doChangePassword(){ const a=$('#np1')?$('#np1').value:'', b=$('#np2')?$('#np2').value:''; const m=$('#cpMsg');
  if(a.length<4){ if(m)m.innerHTML='<span style="color:var(--red)">Use at least 4 characters</span>'; return; }

      <button class="btn dark sm" style="margin-top:8px" onclick="createUser()">＋ Create account (default 1234, change required)</button>
    </div>
    <div class="sec" style="margin:6px 0">Accounts (${us.length})</div>
    ${rows}
    <button class="btn ghost sm" style="margin-top:8px" onclick="${state.role==='admin'?'renderAdmin':'renderMgr'}()">← Back</button></div>`;
}
function createUser(){ const full=($('#uFull')&&$('#uFull').value.trim())||''; if(!full){toast('⚠️ Enter full name');return;}
  let un=($('#uUser')&&$('#uUser').value.trim().toLowerCase())||''; if(!un){ const p=full.toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/); un=((p[0]&&p[0][0])||'')+((p[p.length-1])||''); }
  let base=un||'user',n=1; while(state.users.some(x=>x.username===un && x.companyId===state.company.id)) un=base+(++n);
  const role=($('#uRole')&&$('#uRole').value)||'Attendant'; const station=($('#uStation')&&$('#uStation').value)||state.company.stations[0].id; const pass=($('#uPass')&&$('#uPass').value)||'1234';
  state.users.push({companyId:state.company.id, fullName:full, username:un, passwordHash:hashPw(pass), employeeId:'U'+String(state.users.length+1).padStart(3,'0'), station, role, status:'Active', mustChange:true});
  toast('✓ Account created · @'+un+(pass==='1234'?' · default 1234':'')); renderUsers();
}
function resetPassword(un){ const u=state.users.find(x=>x.username===un&&x.companyId===state.company.id); if(!u)return; u.passwordHash=hashPw('1234'); u.mustChange=true; toast('🔑 '+u.fullName+' reset to default 1234'); renderUsers(); }
function toggleActive(un){ const u=state.users.find(x=>x.username===un&&x.companyId===state.company.id); if(!u)return; u.status=u.status==='Active'?'Inactive':'Active'; toast(u.fullName+' → '+u.status); renderUsers(); }

/* ================= SUBSCRIPTION & BILLING (SaaS) ================= */
function renderPaywall(){ stopFocalLive(); stopMgrLive(); stopDemo(); $('#navbar').innerHTML='';
  const c=state.company; const admin=(state.currentUser&&(state.currentUser.role==='Administrator'||state.currentUser.role==='Manager'));
  $('#appBody').innerHTML=`<div class="fade" style="padding-top:18px">
    <div class="center" style="margin-bottom:12px"><div style="width:64px;height:64px;border-radius:16px;background:#fee2e2;display:grid;place-items:center;margin:0 auto;font-size:30px">🔒</div>
      <h3 style="color:var(--red);margin:12px 0 2px">Subscription required</h3><div class="tiny muted">${c.name} · ${c.subscription.status}</div></div>
    <div class="banner warn"><span class="b">⚠️</span><div>This company’s subscription is <b>${c.subscription.status}</b>. Operations are locked until it is reactivated.</div></div>
    ${admin?`<button class="btn primary" onclick="renderBilling()">💳 Go to billing & reactivate</button>`:`<p class="tiny muted center">Please contact your administrator to reactivate the subscription.</p>`}
    <button class="btn ghost sm" style="margin-top:8px" onclick="doLogout()">⎋ Sign out</button></div>`;
}
function renderBilling(){ stopFocalLive(); $('#navbar').innerHTML= state.role==='admin'?adminNavHTML():managerNavHTML();
  const c=state.company; const s=c.subscription; const pl=planById(s.plan);
  const users=state.users.filter(u=>u.companyId===c.id).length, stations=c.stations.length;
  const dleft=subDaysLeft(c);
  const stat = s.status==='Active'?'<span class="pill ok">Active</span>':(s.status==='Trial'?('<span class="pill warn">Trial'+(dleft!==null?' · '+(dleft>=0?dleft+' days left':'expired'):'')+'</span>'):'<span class="pill bad">'+s.status+'</span>');
  const nextBill = s.status==='Active'?new Date(Date.now()+30*864e5).toISOString().slice(0,10):'—';
  const planCards=PLANS.map(p=>`<div class="kpi" style="${p.id===s.plan?'border-color:#1B7A3D;background:var(--green-l)':''};cursor:pointer" onclick="choosePlan('${p.id}')"><div class="k">${p.name}</div><div class="v" style="font-size:16px;color:var(--green-d)">${p.custom?'Custom':(p.monthly?money(p.monthly)+'/mo':'Free')}</div><div class="u">${p.stations>999?'∞':p.stations} station(s) · ${p.seats>999?'∞':p.seats} users${p.id===s.plan?' · current':''}</div></div>`).join('');
  $('#appBody').innerHTML=`<div class="fade"><h3 class="sec">💳 Subscription & billing · ${c.name}</h3>
    <div class="card">
      <div class="rowb"><span>Current plan</span><b>${pl.name}</b></div>
      <div class="rowb"><span>Status</span><b>${stat}</b></div>
      <div class="rowb"><span>Monthly</span><b>${s.monthly?money(s.monthly):(s.status==='Trial'?'Free during trial':'—')}</b></div>
      <div class="rowb"><span>Next billing date</span><b>${nextBill}</b></div>
      <div class="rowb"><span>Usage</span><b>${stations} station(s) · ${users} user(s)</b></div>
    </div>
    <div class="sec" style="margin:6px 0">Choose a plan</div>
    <div class="kpis">${planCards}</div>
    <div class="grid2" style="margin-top:10px">
      <button class="btn primary sm" onclick="payNow()">✅ ${s.status==='Active'?'Renew / Pay now':'Activate subscription'}</button>
      <button class="btn red sm" onclick="suspendSub()">⏸ Suspend</button>
    </div>
    <div class="banner ok" style="background:#eff6ff;border-color:#bfdbfe"><span class="b">ℹ️</span><div>Demo billing — “Pay now” simulates a successful charge. Production connects a real payment provider.</div></div>
    <button class="btn ghost sm" style="margin-top:8px" onclick="${state.role==='admin'?'renderAdmin':'renderMgr'}()">← Back</button></div>`;
}
function choosePlan(id){ const p=planById(id); state.company.subscription.plan=id; state.company.subscription.monthly=p.monthly; toast('Selected '+p.name+' — click “Activate/Pay now” to confirm'); renderBilling(); }
function payNow(){ const s=state.company.subscription; s.status='Active'; if(!s.since)s.since=new Date().toISOString().slice(0,10); s.trialEndsOn=''; toast('✅ Payment received — subscription activated'); renderBilling(); }
function suspendSub(){ state.company.subscription.status='Suspended'; toast('⏸ Subscription suspended'); renderBilling(); }

/* ================= START/ROLE SCREEN HOOKS ================= */
function refreshTop(){
  const tb=$('#topbar'); if(!tb) return;
  const color = state.station?.color || state.company?.color || '#1B7A3D';
  const dark = state.station?.colorDark || state.company?.colorD || '#14532D';
  tb.style.background = `linear-gradient(135deg, ${color} 0%, ${dark} 100%)`;
  const who = state.currentUser ? state.currentUser.fullName : (state.role==='attendant' ? state.attendant : (state.role==='manager' ? STATION_MANAGER : 'System'));
  const roleLabel = state.role ? state.role.charAt(0).toUpperCase() + state.role.slice(1) : 'Platform';
  tb.innerHTML=`<div class="row"><div class="brand"><div class="logo">${logoLetters()}</div><div>${state.company?state.company.name:PLATFORM_NAME}</div></div><div class="who"><b>${roleLabel}</b>${state.station?state.station.name:'Platform'}</div></div>${state.role ? `<div class="shiftchip"><span><span class="dot"></span>${state.role==='attendant' ? state.shift : 'Live'}</span><span>${state.station?state.station.code:'—'}</span></div>` : ''}`;
}
function renderStart(){
  state.view='home';
  refreshTop();
  $('#navbar').innerHTML=attendantNavHTML('home');
  $('#appBody').innerHTML=`<div class="fade"><h3 class="sec">${state.station?state.station.name:''} · Shift start</h3>
    <div class="card">
      <label class="fl">Attendant</label>
      <select class="txt sel" id="shiftAtt" onchange="state.attendant=this.value">${ATTENDANTS.map(a=>`<option ${a===state.attendant?'selected':''}>${a}</option>`).join('')}</select>
      <label class="fl" style="margin-top:10px">Shift</label>
      <select class="txt sel" id="shiftName" onchange="state.shift=this.value">${SHIFTS.map(s=>`<option ${s.name===state.shift?'selected':''}>${s.name}</option>`).join('')}</select>
      <label class="fl" style="margin-top:10px">Shift date</label>
      <input class="txt" type="date" id="shiftDate" value="${state.shiftDate}" onchange="state.shiftDate=this.value; if(!state.shiftDate) state.shiftDate=TODAY;">
      <label class="fl" style="margin-top:10px">Shift start time</label>
      <input class="txt" type="time" id="shiftStart" value="${state.shiftStart}" onchange="state.shiftStart=this.value;">
    </div>
    <button class="btn primary" onclick="startShift()">Start shift</button>
    <button class="btn ghost sm" style="margin-top:8px" onclick="renderAttendantMenu()">Main menu</button></div>`;
}
function startShift(){
  state.shiftStarted = true;
  state.attendant = $('#shiftAtt') ? $('#shiftAtt').value : state.attendant;
  state.shift = $('#shiftName') ? $('#shiftName').value : state.shift;
  state.shiftDate = $('#shiftDate') ? $('#shiftDate').value || TODAY : TODAY;
  state.shiftStart = $('#shiftStart') ? $('#shiftStart').value || '08:00' : '08:00';
  renderAttendantMenu();
}

function attendantNavHTML(active){
  return `<button class="${active==='home'?'on':''}" onclick="nav('home')"><span class="ic">▦</span>Home</button>
    <button class="${active==='list'?'on':''}" onclick="nav('list')"><span class="ic">☰</span>List</button>
    <button class="${active==='report'?'on':''}" onclick="nav('report')"><span class="ic">▤</span>Report</button>
    <button class="${active==='menu'?'on':''}" onclick="renderAttendantMenu()"><span class="ic">☰</span>Menu</button>`;
}
function managerNavHTML(){
  return `<button class="on" onclick="renderMgr()"><span class="ic">▦</span>Dashboard</button>
    <button onclick="renderFocal()"><span class="ic">🛰️</span>Focal</button>
    <button onclick="renderUsers()"><span class="ic">👥</span>Users</button>
    <button onclick="renderSettings()"><span class="ic">⚙️</span>Config</button>`;
}

// initialize first load
renderTenantPicker();

</script>
</body>
</html>
