<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Gas CNG · Digital Attendant Prototype</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B7A3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Energy Station">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --green:#1B7A3D; --green-d:#14532D; --green-l:#E6F4EA; --green-ll:#F4FAF6;
    --amber:#B45309; --amber-l:#FEF3C7; --red:#B91C1C; --red-l:#FEE2E2;
    --ink:#1F2937; --muted:#6B7280; --line:#E5E7EB; --white:#fff;
    --blue:#1D4E89;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0f172a;color:var(--ink);
    display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start;padding:28px 14px;min-height:100vh}
  .stage{display:flex;flex-direction:column;align-items:center;gap:14px}
  .stage h2{color:#e2e8f0;font-size:14px;font-weight:600;margin:0;letter-spacing:.3px}
  .stage p.sub{color:#94a3b8;font-size:12px;margin:0 0 2px;max-width:360px;text-align:center}

  /* phone frame */
  .phone{width:378px;height:772px;background:#000;border-radius:44px;padding:12px;box-shadow:0 30px 70px rgba(0,0,0,.55);position:relative}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#000;border-radius:0 0 18px 18px;z-index:40}
  .screen{width:100%;height:100%;background:#F7F9F8;border-radius:33px;overflow:hidden;position:relative;display:flex;flex-direction:column}

  /* app chrome */
  .topbar{background:linear-gradient(135deg,var(--green) 0%,var(--green-d) 100%);color:#fff;padding:34px 18px 14px;flex-shrink:0}
  .topbar .row{display:flex;justify-content:space-between;align-items:center}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
  .logo{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--green);display:grid;place-items:center;font-weight:800;font-size:14px}
  .who{font-size:11px;opacity:.9;text-align:right;line-height:1.35}
  .who b{display:block;font-size:12px}
  .shiftchip{margin-top:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:12px;
    padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
  .shiftchip .dot{width:8px;height:8px;border-radius:50%;background:#86efac;display:inline-block;margin-right:6px;box-shadow:0 0 0 3px rgba(134,239,172,.3)}

  .body{flex:1;overflow-y:auto;padding:16px 16px 90px}
  .body::-webkit-scrollbar{width:0}

  /* nav */
  .nav{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;
    padding:9px 6px 16px;flex-shrink:0;z-index:30}
  .nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;flex:1}
  .nav button .ic{font-size:19px;line-height:1}
  .nav button.on{color:var(--green)}
  .fab{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;
    display:grid;place-items:center;font-size:26px;margin-top:-24px;box-shadow:0 8px 18px rgba(27,122,61,.5);border:3px solid #fff}

  /* generic */
  h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:4px 0 10px;font-weight:700}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.primary{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;box-shadow:0 6px 14px rgba(27,122,61,.35)}
  .btn.dark{background:var(--green-d);color:#fff}
  .btn.ghost{background:#fff;color:var(--green);border:2px solid var(--green)}
  .btn.amber{background:var(--amber);color:#fff}
  .btn.red{background:#fff;color:var(--red);border:2px solid var(--red)}
  .btn.sm{padding:11px;font-size:14px;border-radius:12px}
  .btn:active{transform:scale(.98)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  label.fl{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:2px 0 7px;text-transform:uppercase;letter-spacing:.4px}
  input.big{width:100%;border:2px solid var(--line);border-radius:13px;padding:14px;font-size:22px;font-weight:700;color:var(--ink);text-align:center;outline:none}
  input.big:focus{border-color:var(--green)}
  input.txt{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:15px;outline:none}
  input.txt:focus{border-color:var(--green)}
  select.sel{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px;font-size:15px;font-weight:600;color:var(--ink);background:#fff;outline:none;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%231B7A3D' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
  select.sel:focus{border-color:var(--green)}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:13px;padding:14px 8px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
  .seg button .ic{font-size:22px}
  .seg button.on{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:11px;padding:12px 4px;font-weight:700;font-size:14px;color:var(--muted);text-align:center;cursor:pointer}
  .chip.on{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
  .muted{color:var(--muted)}.tiny{font-size:11px}.center{text-align:center}
  .amt{font-size:34px;font-weight:800;color:var(--green-d);text-align:center;letter-spacing:-.5px}
  .rowb{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--green-ll);font-size:14px}
  .rowb:last-child{border-bottom:0}
  .rowb b{font-weight:700}
  .pill{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
  .pill.ok{background:var(--green-l);color:var(--green-d)}
  .pill.warn{background:var(--amber-l);color:var(--amber)}
  .pill.bad{background:var(--red-l);color:var(--red)}

  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}
  .kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
  .kpi .v{font-size:22px;font-weight:800;color:var(--green-d);margin-top:3px;line-height:1}
  .kpi .u{font-size:11px;color:var(--muted);font-weight:600}
  .kpi.wide{grid-column:1/3;background:linear-gradient(135deg,var(--green),var(--green-d));border:0;color:#fff}
  .kpi.wide .k{color:rgba(255,255,255,.85)}.kpi.wide .v{color:#fff;font-size:28px}.kpi.wide .u{color:rgba(255,255,255,.85)}

  /* camera */
  .cam{background:#111827;border-radius:16px;height:210px;position:relative;overflow:hidden;display:grid;place-items:center;margin-bottom:12px}
  .cam .frame{position:absolute;inset:26px 30px;border:2px dashed rgba(255,255,255,.55);border-radius:10px}
  .cam .plate{background:#f8fafc;border:3px solid #111;border-radius:7px;padding:8px 16px;font-weight:800;font-size:26px;letter-spacing:2px;color:#111;box-shadow:0 4px 10px rgba(0,0,0,.4);transform:rotate(-1.5deg)}
  .cam .hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#cbd5e1;font-size:11px}
  .scan{position:absolute;left:30px;right:30px;height:2px;background:#86efac;box-shadow:0 0 10px #86efac;top:26px;animation:scan 1.1s ease-in-out infinite}
  @keyframes scan{0%{top:26px}50%{top:180px}100%{top:26px}}

  .txn{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--green-ll)}
  .txn:last-child{border-bottom:0}
  .txn .ico{width:38px;height:38px;border-radius:10px;background:var(--green-l);display:grid;place-items:center;font-size:19px;flex-shrink:0}
  .txn .mid{flex:1;min-width:0}
  .txn .mid b{font-size:14px}
  .txn .mid .m{font-size:11px;color:var(--muted)}
  .txn .amt2{font-weight:800;color:var(--green-d);font-size:14px;text-align:right}
  .txn .amt2 .m{font-size:10px;color:var(--muted);font-weight:600}

  .toast{position:absolute;left:14px;right:14px;bottom:78px;background:var(--green-d);color:#fff;border-radius:14px;padding:13px 15px;
    font-size:13px;font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.35);z-index:50;display:flex;gap:10px;align-items:center;
    opacity:0;transform:translateY(12px);transition:.28s;pointer-events:none}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast .big{font-size:20px}

  .banner{border-radius:13px;padding:12px 13px;font-size:13px;margin-bottom:12px;display:flex;gap:9px;align-items:flex-start}
  .banner.warn{background:var(--amber-l);color:#7c2d12;border:1px solid #fcd34d}
  .banner.ok{background:var(--green-l);color:var(--green-d);border:1px solid #bbf7d0}
  .banner .b{font-size:18px;line-height:1}
  .kv{font-size:13px;display:flex;justify-content:space-between;padding:4px 0}
  .kv .l{color:var(--muted)}
  .hidden{display:none}
  .stepdots{display:flex;gap:5px;justify-content:center;margin:0 0 12px}
  .stepdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .stepdots i.on{background:var(--green);width:20px;border-radius:5px}

  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .legend{max-width:380px;color:#94a3b8;font-size:11px;text-align:center;line-height:1.6}
  .legend b{color:#cbd5e1}
  .camimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0b1220;border-radius:16px}
  .thumb{width:46px;height:46px;border-radius:9px;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}

  /* ---- phone / small screens: run full-screen like a real app ---- */
  @media (max-width:820px){
    body{padding:0;gap:0;background:var(--green-d);display:block}
    .stage{width:100%;gap:0;margin-bottom:0}
    .stage h2{background:var(--green-d);color:#dcfce7;width:100%;padding:9px 14px;font-size:12px;text-align:center;box-sizing:border-box}
    .stage p.sub,.legend{display:none}
    .phone{width:100%;height:calc(100vh - 34px);min-height:560px;border-radius:0;padding:0;box-shadow:none}
    .notch{display:none}
    .screen{border-radius:0;height:100%}
    .topbar{padding-top:16px}
    .body{padding-bottom:96px}
  }
  @media (max-width:820px) and (display-mode:standalone){
    .phone{height:100vh}
  }
</style>
</head>
<body>

<!-- ============ SINGLE ROLE-GATED APP ============ -->
<div class="stage">
  <h2 id="stageCap">Green Gas CNG</h2>
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="topbar" id="topbar"><!-- role-based header injected --></div>

      <div class="body" id="appBody"><!-- screens injected --></div>

      <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(event)">

      <div class="nav" id="navbar"><!-- role-based nav injected --></div>

      <div class="toast" id="toast"></div>
    </div>
  </div>
  <div class="legend" id="legend">Sign in as an Attendant to record refills, or as the Station Manager to view the live dashboard. Each role sees only its own screens.</div>
</div>

<script>

/* ================= PLATFORM / MULTI-TENANT CONFIG ================= */
let PLATFORM_NAME = 'Energy Station Platform';   // configurable, not branded to one company
// Companies (tenants) — each fully isolated. CNG is Version 1; energyTypes is configurable.
const COMPANIES = [
  { id:'C001', name:'Green Gas CNG', trading:'Green Gas', country:'Tanzania', currency:'TZS',
    color:'#1B7A3D', colorD:'#14532D', energyTypes:['CNG'], pricePerKg:1550, pointsPerKg:1,
    stations:[ {id:'S01',code:'GG-MAIN',name:'Main Station',status:'Active'},
               {id:'S02',code:'GG-MIKO',name:'Mikocheni',status:'Active'} ],
    licences:[ {name:'EWURA Operating Licence', number:'EWURA/CNG/2024/012', issuer:'EWURA', issued:'2024-01-15', expiry:'2026-12-31', fileName:'ewura_licence.pdf', fileData:null},
               {name:'Fire Safety Certificate', number:'FIRE/2025/220', issuer:'Fire & Rescue Force', issued:'2025-03-01', expiry:'2026-03-01', fileName:'fire_cert.pdf', fileData:null},
               {name:'Meter Calibration Certificate', number:'WMA/2025/44', issuer:'Weights & Measures Agency', issued:'2025-06-01', expiry:'2026-06-01', fileName:'meter_cal.pdf', fileData:null},
               {name:'Business Licence', number:'BRELA/2024/9981', issuer:'BRELA', issued:'2024-01-10', expiry:'2027-01-10', fileName:'', fileData:null} ] },
  { id:'C002', name:'BlueFuel Energy', trading:'BlueFuel', country:'Tanzania', currency:'TZS',
    color:'#1D4E89', colorD:'#0f2f57', energyTypes:['CNG','LNG'], pricePerKg:1600, pointsPerKg:2,
    stations:[ {id:'S01',code:'BF-DOD',name:'Dodoma 01',status:'Active'} ],
    licences:[ {name:'EWURA Operating Licence', number:'EWURA/CNG/2025/077', issuer:'EWURA', issued:'2025-02-01', expiry:'2027-02-01', fileName:'', fileData:null} ] }
];
function companyById(id){ return COMPANIES.find(c=>c.id===id)||COMPANIES[0]; }
// ---- SaaS subscription plans (monthly, TZS) ----
const PLANS=[
  {id:'trial',name:'Free Trial (14 days)',monthly:0,seats:5,stations:1,tag:'Try it'},
  {id:'standard',name:'Standard',monthly:250000,seats:15,stations:2,tag:'Single station'},
  {id:'pro',name:'Pro',monthly:600000,seats:50,stations:10,tag:'Growing operator'},
  {id:'enterprise',name:'Enterprise',monthly:0,seats:9999,stations:9999,custom:true,tag:'Custom / contact us'}
];
function planById(id){ return PLANS.find(p=>p.id===id)||PLANS[0]; }
function subDaysLeft(c){ const s=c&&c.subscription; if(!s||!s.trialEndsOn)return null; return Math.ceil((new Date(s.trialEndsOn)-new Date())/864e5); }
function subActive(c){ c=c||state.company; if(!c||!c.subscription)return true; const s=c.subscription; if(s.status==='Active')return true; if(s.status==='Trial'){ const d=subDaysLeft(c); return d===null||d>=0; } return false; }
(function seedSubs(){ const now=new Date(); const trialEnd=new Date(now.getTime()+14*864e5).toISOString().slice(0,10);
  COMPANIES.forEach(c=>{ if(!c.subscription) c.subscription={plan:'trial',status:'Trial',trialEndsOn:trialEnd,monthly:0,since:now.toISOString().slice(0,10)}; });
  companyById('C001').subscription={plan:'pro',status:'Active',trialEndsOn:'',monthly:600000,since:'2026-01-01'};
  companyById('C002').subscription={plan:'trial',status:'Trial',trialEndsOn:trialEnd,monthly:0,since:now.toISOString().slice(0,10)};
})();
function price(){ return state.company?state.company.pricePerKg:1550; }
function pts(){ return state.company?state.company.pointsPerKg:1; }
function cur(){ return state.company?state.company.currency:'TZS'; }
// Platform module catalog (§58) — Active modules map to built screens; others are Version-1 roadmap
const MODULES = [
  {k:'ops',name:'Operations',icon:'🛠️',status:'Active'},{k:'gas',name:'Gas & Reconciliation',icon:'🛢️',status:'Active'},
  {k:'sales',name:'Sales & Dispensing',icon:'⛽',status:'Active'},{k:'customers',name:'Customers',icon:'👥',status:'Active'},
  {k:'loyalty',name:'Loyalty',icon:'⭐',status:'Active'},{k:'care',name:'Customer Care',icon:'📞',status:'Planned'},
  {k:'maint',name:'Maintenance',icon:'🔧',status:'Planned'},{k:'inv',name:'Inventory',icon:'📦',status:'Planned'},
  {k:'hse',name:'HSE & Safety',icon:'🦺',status:'Planned'},{k:'comp',name:'Compliance',icon:'📜',status:'Planned'},
  {k:'staff',name:'Staff & Shifts',icon:'🧑',status:'Active'},{k:'fin',name:'Finance',icon:'💰',status:'Active'},
  {k:'inc',name:'Incidents',icon:'⚠️',status:'Planned'},{k:'iot',name:'IoT / Equipment',icon:'📡',status:'Planned'},
  {k:'analytics',name:'Analytics',icon:'📈',status:'Active'},{k:'reports',name:'Reports',icon:'📊',status:'Active'},
  {k:'recon',name:'Reconciliations',icon:'🧮',status:'Active'},{k:'settings',name:'Settings',icon:'⚙️',status:'Active'}
];

/* ================= STATION MASTER DATA ================= */
const ATTENDANTS = [
  'Salha Mohamed Duge','Mary Aloyce Shio','Magreth Selemani Adamu','Sunday Alfred Mmanda',
  'Rajabu Shija Rajabu','Rashid Haji Simtitu','Swaumu Abubakari Kidindi','Beatrice Nasiph Kinyau',
  'Pius Maberi Phares','Johnson Noel Koroto'
];
const SHIFTS = [
  {name:'Day',   time:'08:00 – 18:30', start:'08:00', end:'18:30'},
  {name:'Night', time:'18:30 – 08:00', start:'18:30', end:'08:00'}
];
const STATION_MANAGER = 'Erick Hussein Mshamu';
const MANAGER_PIN = '1234';
const PROVIDERS = ['Mixx by Yas','Airtel Money','Selcom','M-Pesa','HaloPesa','T-Pesa'];
const PAY_CHANNELS = ['Cash', ...PROVIDERS, 'Account (Credit)'];
const PERMITS = ['Active','Valid','Inactive','Invalid','Expired'];
const PERMIT_OK = ['Active','Valid'];
const BAJAJ_TYPES = ['TVS King Bajaj','Other Bajaj'];
const BULK_POSTS = ['Bulk Post 1','Bulk Post 2'];   // industrial gas take-off points
const KG_MIN = 0.5, KG_MAX = 25;
// Real-time date/time taken directly from the phone / device clock
function deviceDate(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
function deviceTime(){ const n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
const TODAY = deviceDate();   // demo data is dated to the device's current day
// Synchronization states (Attendant → central store → Manager)
const SYNC = { PENDING:'Pending Synchronization', SYNCING:'Synchronizing', SYNCED:'Synchronized', FAILED:'Synchronization Failed' };
function syncShort(s){ return s.replace('Pending Synchronization','Pending sync').replace('Synchronizing','Syncing').replace('Synchronization Failed','Sync failed'); }
function syncBadge(s){ const cls={[SYNC.SYNCED]:'ok',[SYNC.PENDING]:'warn',[SYNC.SYNCING]:'warn',[SYNC.FAILED]:'bad'}[s]||'warn';
  const ic={[SYNC.SYNCED]:'✓',[SYNC.PENDING]:'⟳',[SYNC.SYNCING]:'⟳',[SYNC.FAILED]:'⚠'}[s]||'•'; return `<span class="pill ${cls}">${ic} ${syncShort(s)}</span>`; }
const SYNC_INTERVAL_MS = 3000;   // Manager live auto-refresh cadence (configurable, no code change)
const DEMO_INTERVAL_MS = 5000;   // Live-demo: simulate an incoming attendant sale every N ms

function classify(p){ const s=(p||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(s.startsWith('MC'))return'Three-Wheeler'; if(s.startsWith('T'))return'Four-Wheeler'; return''; }
const isThree = t => t==='Three-Wheeler';
function typeIcon(t){ return isThree(t)?'🛺':'🚗'; }
function typeShort(t){ return isThree(t)?'3-Wheeler':'4-Wheeler'; }
function permitOK(s){ return PERMIT_OK.includes(s); }

const state = {
  company:null, station:null, platformAdmin:false,   // tenant context
  role:null, attendant:ATTENDANTS[0], shift:'Day', shiftDate:TODAY, shiftStart:'08:00', shiftStarted:false,
  seq:0, memberSeq:2000, txns:[], nozzles:['Nozzle 1','Nozzle 2','Nozzle 3','Nozzle 4'], draft:null, view:'home',
  filter:{date:'All',attendant:'All',shift:'All',type:'All',payment:'All',permit:'All',bajaj:'All',loyalty:'All',q:''},
  central:{lastSync:null,lastRec:null}, mgrTimer:null,
  dataVersion:0, lastRenderVersion:-1, demoLive:false, demoTimer:null,
  currentUser:null, users:[], loginFail:0,     // authentication
  // Integration health (demo: device links are configurable/simulated; real ones need hardware+credentials)
  integrations:{ Internet:'Online', Database:'Online', Synchronization:'Online',
    POS:'Configuration required', 'VFD / Fiscal':'Configuration required', 'RFID reader':'Configuration required', 'Payment gateway':'Configuration required' },
  rfids:[], receiptSeq:1000, focalTimer:null
};
/* ---- Passwords: hashed (demo hash stands in for bcrypt/Argon2 server-side); never stored/shown in plain text ---- */
function hashPw(s){ let h=5381; s=String(s); for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return 'h'+((h>>>0).toString(16)); }

/* ================= TRANSACTION MODEL + SEED ================= */
function buildRec(o){
  const comp = companyById(o.companyId||'C001');
  const type = o.type || classify(o.plate) || 'Four-Wheeler';
  const denied = !!o.denied;
  const industrial = o.mode==='Industrial';
  // Industrial: quantity comes from meter (end − start); else attendant-entered kg
  const kg = denied?0:(industrial?+Math.max(0,(+o.meterEnd||0)-(+o.meterStart||0)).toFixed(2):(+o.kg||0));
  const unit = (industrial && +o.negPrice>0)?+o.negPrice:comp.pricePerKg;   // negotiated price override
  const member = isThree(type) && (o.bajajStatus==='Member' || o.bajajType==='TVS King Bajaj');
  const loyaltyStatus = member?'Member':'Non-member';
  const membershipId = member ? (o.membershipId||'') : '';
  const points = (member && !denied && permitOK(o.permit)) ? +(kg*comp.pointsPerKg).toFixed(2) : 0;
  // Central Transaction Engine metadata
  const source = o.source || (industrial?'Bulk Post':(o.rfid?'RFID':'Dispenser'));
  const txType = o.txType || (industrial?'Bulk CNG':'Retail CNG');
  state.receiptSeq = (state.receiptSeq||1000)+1; const receiptNo='RCP-'+state.receiptSeq;
  const payStatus = denied?'—':(o.pay==='Account (Credit)'?'Pending':(o.paymentStatus||'Received'));
  const vfdStatus = denied?'—':((state.integrations&&state.integrations['VFD / Fiscal']==='Online')?'Fiscalized':'Pending');
  const posRef = denied?'':((state.integrations&&state.integrations.POS==='Online')?'POS-'+state.receiptSeq:'');
  return {
    source, txType, rfid:o.rfid||'', paymentStatus:payStatus, posRef, vfdStatus, receiptNo,
    companyId:comp.id, stationId:o.stationId||'S01', tenantId:comp.id,
    id:comp.id+'-'+(o.stationId||'S01')+'-'+(o.date||state.shiftDate).replace(/-/g,'')+'-'+String(state.seq).padStart(4,'0'),
    date:o.date, time:o.time, attendant:o.att, shift:o.shift, shiftStart:(SHIFTS.find(s=>s.name===o.shift)||SHIFTS[0]).start,
    // industrial metering / pressure / temperature / negotiated / credit / trailer / evidence / confirmation
    mode:industrial?'Industrial':'Retail', meterStart:(+o.meterStart||null), meterEnd:(+o.meterEnd||null),
    pressure:o.pressure||'', temperature:o.temperature||'', negotiated:(industrial && unit!==comp.pricePerKg),
    customerAccount:o.customerAccount||'', trailerId:o.trailerId||'',
    photos:o.photos||[], confirmed:!!o.confirmed, confirmedBy:o.confirmedBy||'',
    plate:o.plate, type,
    driver:o.driver||'', phone:o.phone||'',
    bajajStatus:isThree(type)?(o.bajajStatus||''):'', bajajType:isThree(type)?(o.bajajType||''):'',
    loyaltyStatus, membershipId, points,
    kg, unitPrice:unit, amount:Math.round(kg*unit),
    permit:o.permit||'Active', denied,
    reason:denied?(o.reason||'Not refilled'):'', remarks:o.remarks||'',
    pay:denied?'—':o.pay, provider:(o.pay==='Mobile Money')?(o.prov||'M-Pesa'):'',
    nozzle:denied?'—':(o.noz||'Nozzle 1'), method:o.method||'ANPR/OCR', conf:o.conf||0.9, photo:(o.photos&&o.photos[0])||o.photo||null, status:'Completed',
    syncStatus:o.sync||SYNC.SYNCED, syncAt:o.syncAt||((o.date||TODAY)+' '+(o.time||''))
  };
}

/* ---- Synchronization engine (Attendant → central store → Manager) ---- */
function nowStamp(){ return state.shiftDate+' '+clock(); }
function commitToCentral(rec){ rec.syncStatus=SYNC.SYNCED; rec.syncAt=nowStamp(); state.central.lastSync=rec.syncAt; state.central.lastRec=rec; bumpData(); uiSyncTick(rec); }
function scheduleSync(rec){
  setTimeout(()=>{ rec.syncStatus=SYNC.SYNCING; uiSyncTick(rec);
    setTimeout(()=>{
      if(Math.random()<0.12){ rec.syncStatus=SYNC.FAILED; bumpData(); uiSyncTick(rec);   // transient failure → auto-retry
        setTimeout(()=>{ commitToCentral(rec); }, 1600);
      } else { commitToCentral(rec); }
    }, 800);
  }, 700);
}
function uiSyncTick(rec){
  const b=$('#succSync'); if(b && state.draft===null && state.view==='success') {} // no-op guard
  if($('#succSync_'+rec.id)) $('#succSync_'+rec.id).innerHTML=syncBadge(rec.syncStatus);
  if(state.role==='attendant' && state.view==='list') renderList();
  if(state.role==='manager' && $('#syncPanel')) $('#syncPanel').innerHTML=syncPanelHTML();
}

/* ---- Manual backup: genuine station-wide synchronization (not a page refresh) ---- */
function syncAllData(){
  toast('🔄 Synchronizing all data across all attendants…');
  const scope=scopeTxns();
  let n=0; scope.forEach(x=>{ if(x.syncStatus!==SYNC.SYNCED){ x.syncStatus=SYNC.SYNCED; x.syncAt=nowStamp(); n++; } }); // reconcile pending/failed
  const last=scope[scope.length-1]; if(last){ state.central.lastSync=nowStamp(); state.central.lastRec=last; }
  bumpData(); renderMgr();
  toast('✓ Synchronized '+completed(scope).length+' transactions across '+activeAttendants()+' attendants'+(n?(' · '+n+' reconciled'):''));
}

function registerCompany(){

  const id=nextCompanyId();
  const pal=BRAND_PALETTE[(COMPANIES.length)%BRAND_PALETTE.length];
  const initials=name.split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase();
  const code=(($('#regCode')&&$('#regCode').value.trim())|| (initials+'-01')).toUpperCase();

    pricePerKg:+($('#regPrice')&&$('#regPrice').value)||1550, pointsPerKg:+($('#regPoints')&&$('#regPoints').value)||1,

function renderGasRecon(){ $('#navbar').innerHTML='';
  if(!state.gasForm) state.gasForm={opening:'',received:'',internal:'',losses:'',physClose:''};
  const g=state.gasForm; const sold=+metrics(completed(scopeTxns())).kg.toFixed(2);
  const opening=+g.opening||0, received=+g.received||0, internal=+g.internal||0, losses=+g.losses||0;
  const closing=+(opening+received-sold-internal-losses).toFixed(2);
  const phys=+g.physClose||0; const variance=+(phys-closing).toFixed(2); const varPct=closing?(variance/closing*100):0; const abn=Math.abs(varPct)>2;
  $('#appBody').innerHTML=`<div class="fade"><h3 class="sec">🛢️ Gas balance & reconciliation · ${state.station?state.station.name:''}</h3>
    <div class="banner ok"><span class="b">ℹ️</span><div>Opening + Received − Sold − Internal use − Losses = Closing. <b>Sold</b> is pulled automatically from transactions.</div></div>

      <div class="grid2" style="margin-top:8px"><div><label class="fl">Internal use (kg)</label><input class="txt" type="number" value="${g.internal}" oninput="state.gasForm.internal=this.value;renderGasRecon()"></div><div><label class="fl">Losses / vented (kg)</label><input class="txt" type="number" value="${g.losses}" oninput="state.gasForm.losses=this.value;renderGasRecon()"></div></div>
    </div>
    <div class="card">
      <div class="rowb"><span>Opening</span><b>${opening.toFixed(1)}</b></div>
      <div class="rowb"><span>+ Received</span><b>${received.toFixed(1)}</b></div>
      <div class="rowb"><span>− Sold (from transactions)</span><b>${sold.toFixed(1)}</b></div>
      <div class="rowb"><span>− Internal use</span><b>${internal.toFixed(1)}</b></div>
      <div class="rowb"><span>− Losses / vented</span><b>${losses.toFixed(1)}</b></div>

function licStatus(expiry){ if(!expiry) return '<span class="pill">—</span>'; const days=Math.round((new Date(expiry)-new Date())/86400000);

function addLicence(){ const c=state.company; if(!c){ toast('Select a company first'); return; }

function doLogin(){ const un=($('#loginUser')?$('#loginUser').value:'').trim(); const pw=($('#loginPass')?$('#loginPass').value:''); const msg=$('#loginMsg');
  const u=findUser(un);
  if(!u){ state.loginFail++; if(msg)msg.innerHTML='<span style="color:var(--red)">Invalid username or password</span>'; return; }
  if(u.status!=='Active'){ if(msg)msg.innerHTML='<span style="color:var(--red)">Account is inactive — contact your manager</span>'; return; }
  if(u.passwordHash!==hashPw(pw)){ state.loginFail++; if(msg)msg.innerHTML='<span style="color:var(--red)">Invalid username or password'+(state.loginFail>=3?' · repeated failures are being monitored':'')+'</span>'; return; }
  state.loginFail=0; u.lastLogin=state.shiftDate+' '+clock(); state.currentUser=u;
  if(u.mustChange){ renderChangePassword(); return; }
  routeUser();
}
function routeUser(){ const u=state.currentUser; if(!u)return renderLogin();
  if(!subActive(state.company)){ state.role=(u.role==='Administrator')?'admin':(u.role==='Manager'?'manager':'attendant'); refreshTop(); return renderPaywall(); }
  if(u.role==='Attendant'){ state.role='attendant'; state.attendant=u.fullName; refreshTop(); renderStart(); }
  else if(u.role==='Manager'){ state.role='manager'; refreshTop(); $('#navbar').innerHTML=managerNavHTML(); renderMgr(); }
  else { state.role='admin'; refreshTop(); renderAdmin(); }
}

function intDot(s){ return s==='Online'?'🟢':(s==='Warning'?'🟡':(s==='Offline'?'🔴':'⚪')); }
function intPill(s){ return s==='Online'?'ok':(s==='Offline'?'bad':'warn'); }

function dispTile(n,last){ return `<div class="kpi"><div class="k">${n}</div><div class="v" style="font-size:14px;color:${last?'#1D4E89':'#6B7280'}">${last?'COMPLETED':'AVAILABLE'}</div><div class="u">${last?last.plate+' · '+last.kg.toFixed(1)+'kg':'idle'}</div></div>`; }

function focalAlerts(){ const a=[]; Object.keys(state.integrations).forEach(k=>{ const v=state.integrations[k]; if(v==='Offline')a.push([k+' OFFLINE','bad']); else if(v==='Configuration required')a.push([k+' — configuration required','warn']); });
  const fail=scopeTxns().filter(x=>x.syncStatus===SYNC.FAILED).length; if(fail)a.push([fail+' failed synchronisation(s)','bad']);
  if(!a.length) return '<div class="tiny" style="color:var(--green-d)">✓ No active alerts.</div>';
  return a.map(x=>`<div class="rowb"><span>${x[0]}</span><span class="pill ${x[1]}">${x[1]==='bad'?'Critical':'Attention'}</span></div>`).join(''); }

function reconSales(){ const kg=gv('rsKg'),p=gv('rsPrice'),cash=gv('rsCash'),mob=gv('rsMobile'),cr=gv('rsCredit'),intn=gv('rsInternal');
  const gross=kg*p, collected=cash+mob+cr+intn, variance=collected-gross, net=gross-intn;
  const st=Math.abs(variance)<1?'<span class="pill ok">✓ Balanced</span>':(variance<0?'<span class="pill bad">Short '+cur()+' '+f2(-variance)+'</span>':'<span class="pill warn">Over '+cur()+' '+f2(variance)+'</span>');
  const el=$('#rsOut'); if(el) el.innerHTML=rrow('Gross revenue (kg × price)',money(gross))+rrow('Cash / Mobile / Credit',money(cash)+' · '+money(mob)+' · '+money(cr))+rrow('Internal refills',money(intn))+rrow('Total collected',money(collected))+rrow('Variance (collected − gross)',st)+rrow('Net sales (gross − internal)','<b style="color:var(--green-d)">'+money(net)+'</b>')+rrow('Vehicles served / denied',gv('rsServed')+' / '+gv('rsDenied')); }

      <div class="grid2">${fld('giPb','Pressure before (bar)','','reconGas')}${fld('giTb','Temp before (°C)',28,'reconGas')}</div>
      <div class="grid2">${fld('giPa','Pressure after (bar)','','reconGas')}${fld('giTa','Temp after (°C)',28,'reconGas')}</div></div>

function reconGas(){ const inp=gv('giInput'),vent=gv('giVent'),o=gv('giOpen'),c=gv('giClose'),pb=gv('giPb'),tb=gv('giTb'),pa=gv('giPa'),ta=gv('giTa');
  const soldNm3=Math.max(0,c-o), soldKg=soldNm3*RC.RHO_NM3, compressed=Math.max(0,inp-vent);
  const loss=inp>0?(vent+Math.max(0,inp-compressed-vent)):0, lossPct=inp>0?loss/inp:0;
  const storedB=pb>0?RC.CASCADE_VOL*(pb/RC.P_STD)*(RC.T_NORM/(273.15+tb))/RC.Z:0;
  const storedA=pa>0?RC.CASCADE_VOL*(pa/RC.P_STD)*(RC.T_NORM/(273.15+ta))/RC.Z:0;
  const storedD=storedA-storedB, mbVar=compressed-soldNm3-storedD;
  const status=lossPct>RC.LOSS_RED?'<span class="pill bad">CRITICAL</span>':(lossPct>RC.LOSS_YEL?'<span class="pill warn">HIGH</span>':(lossPct>RC.LOSS_TARGET?'<span class="pill warn">Watch</span>':'<span class="pill ok">OK (≤1%)</span>'));
  const el=$('#giOut'); if(el) el.innerHTML=rrow('Gas sold',f2(soldNm3)+' Nm³ · '+f2(soldKg)+' kg')+rrow('Gas compressed (input − vent)',f2(compressed)+' Nm³')+rrow('Gas loss',f2(loss)+' Nm³')+rrow('Loss %',fpct(lossPct)+' '+status)+rrow('Cascade stored (before → after)',f2(storedB)+' → '+f2(storedA)+' Nm³')+rrow('Stored Δ',f2(storedD)+' Nm³')+rrow('Mass-balance variance (compressed − sold − Δstored)','<b style="color:'+(Math.abs(mbVar)>compressed*0.03?'var(--red)':'var(--green-d)')+'">'+f2(mbVar)+' Nm³</b>'); }

function reconElec(){ const o=gv('eOpen'),c=gv('eClose'),ko=gv('ekvaO'),kc=gv('ekvaC'),pf=gv('ePF');
  const dayKwh=Math.max(0,c-o), peak=Math.max(ko,kc), tkwh=gv('eTkwh')||RC.TARIFF_KWH, tkva=gv('eTkva')||RC.TARIFF_KVA, svc=gv('eSvc');
  const dayCost=dayKwh*tkwh+peak*tkva/30;
  const mk=gv('emKwh'),mp=gv('emKva'),kg=gv('eKgSold');
  const energy=mk*tkwh, demand=mp*tkva, sub=energy+demand+svc, vat=sub*RC.VAT, ewura=sub*RC.EWURA, rea=sub*RC.REA, total=sub+vat+ewura+rea, perkg=kg>0?total/kg:0;
  const pfw=pf&&pf<0.85?'<span class="pill warn">Low PF</span>':(pf?'<span class="pill ok">OK</span>':'');
  const el=$('#eOut'); if(el) el.innerHTML='<div class="sec" style="margin:0 0 6px">Daily</div>'+rrow('Daily kWh (close − open)',f2(dayKwh)+' kWh')+rrow('Peak kVA · PF',f2(peak)+' · '+pf+' '+pfw)+rrow('Daily electricity cost',money(dayCost))+
    '<div class="sec" style="margin:10px 0 6px">Monthly build-up</div>'+rrow('Energy ('+f2(mk)+'×'+tkwh+')',money(energy))+rrow('Demand ('+f2(mp)+'×'+tkva+')',money(demand))+rrow('Service charge',money(svc))+rrow('Subtotal',money(sub))+rrow('VAT 18% · EWURA 1% · REA 3%',money(vat)+' · '+money(ewura)+' · '+money(rea))+rrow('TOTAL electricity cost','<b style="color:var(--green-d)">'+money(total)+'</b>')+rrow('Cost per kg gas sold',kg>0?money(perkg)+'/kg':'—'); }

      <label class="fl" style="margin-top:12px">Trailer / skid ID</label><input class="txt" id="trailerId" value="${d.trailerId||''}" placeholder="e.g. SKID-014" oninput="state.draft.trailerId=this.value">
      <label class="fl" style="margin-top:12px">Bulk filling post <span class="muted" style="font-weight:400;text-transform:none">· industrial take-off</span></label><div class="grid2" id="grNoz">${BULK_POSTS.map((n,i)=>`<div class="chip ${d.nozzle===n?'on':''}" onclick="setNoz('${n}',${i})">🛢️ ${n}</div>`).join('')}</div>
      <label class="fl" style="margin-top:12px">Remarks</label><input class="txt" id="remarks" value="${d.remarks||''}" oninput="state.draft.remarks=this.value">

      <div class="amt" id="amt" style="margin-top:12px">${money(Math.round(kgv*price()))}</div>

      <div id="provBox" class="${d.pay==='Mobile Money'?'':'hidden'}" style="margin-top:12px"><label class="fl">Mobile money provider</label>
        <select class="txt sel" id="provider" onchange="state.draft.provider=this.value"><option value="">— select provider —</option>${PROVIDERS.map(p=>`<option${d.provider===p?' selected':''}>${p}</option>`).join('')}</select></div>
      <label class="fl" style="margin-top:16px">Nozzle</label>

/* camera + OCR */
function openCamera(){ const el=$('#camInput'); el.value=''; el.click(); }
function scanPlate(){ state._camMode='plate'; openCamera(); }
function addEvidence(){ state._camMode='evidence'; openCamera(); }
function onPhoto(ev){ const f=ev.target.files&&ev.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ if(state._camMode==='evidence'){ captureForm(); state.draft.photos=(state.draft.photos||[]); if(state.draft.photos.length<3) state.draft.photos.push(rd.result); toast('📸 Evidence photo added ('+state.draft.photos.length+'/3)'); renderForm(); } else { state.draft.photo=rd.result; state.draft.photos=[rd.result]; runOCR(); } };
  rd.readAsDataURL(f); }
function demoScan(){ state.draft.photo=null; runOCR(); }
function runOCR(){ captureForm(); const pick=PLATES[Math.floor(Math.random()*PLATES.length)]; const formatted=formatPlate(pick.raw);
  state.draft.scanned=true; state.draft.conf=pick.conf; state.draft.plate=formatted; state.draft.type=classify(formatted);
  toast('📷 '+formatted+' → '+typeShort(state.draft.type)+' ('+Math.round(pick.conf*100)+'%)'); renderForm();
}
function onPlateInput(){ const f=$('#plateField'); state.draft.plate=f.value; const t=classify(f.value); if(t&&t!==state.draft.type){ state.draft.type=t; } updatePlateStatus(); document.querySelectorAll('#segType button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(state.draft.type==='Four-Wheeler'))); }
function tidyPlate(){ const f=$('#plateField'); if(!f)return; const c=formatPlate(f.value); if(c&&c!==f.value){ f.value=c; state.draft.plate=c; captureForm(); renderForm(); } }
function editPlate(){ const f=$('#plateField'); if(f){ f.focus(); f.select(); } toast('✎ Field is editable'); }
function updatePlateStatus(){ const el=$('#plateStatus'); if(!el)return; const v=($('#plateField')?$('#plateField').value:state.draft.plate)||''; if(!v.trim()){el.innerHTML='<span class="tiny muted">Scan the plate, or type it</span>';return;}
  const t=classify(v); const cls=t?`<span class="pill ok">${typeIcon(t)} ${typeShort(t)}</span>`:''; el.innerHTML=(validPlate(v)?'<span class="pill ok">✓ Verified</span> ':'<span class="pill warn">⚠ Check format</span> ')+cls; }
function setType(t){ captureForm(); state.draft.type=t; if(!isThree(t)){ state.draft.bajajStatus=''; state.draft.bajajType=''; state.draft.membershipId=''; } renderForm(); }
function setBajajStatus(v){ captureForm(); state.draft.bajajStatus=v; if(v!=='Not member')state.draft.bajajType=''; if(v!=='Member')state.draft.membershipId=''; renderForm(); }
function setBajajType(v){ captureForm(); state.draft.bajajType=v; renderForm(); }
function setPermit(v){ captureForm(); state.draft.permit=v; renderForm(); }
function toggleIndustrial(){ captureForm(); state.draft.industrial=!state.draft.industrial; state.draft.pay=''; renderForm(); }
function calc(){ const d=state.draft; let kg=0, unit=price();
  if(d.industrial){ if($('#meterStart'))d.meterStart=$('#meterStart').value; if($('#meterEnd'))d.meterEnd=$('#meterEnd').value; if($('#negPrice'))d.negPrice=$('#negPrice').value;
    kg=Math.max(0,(parseFloat(d.meterEnd)||0)-(parseFloat(d.meterStart)||0)); unit=(parseFloat(d.negPrice)>0)?parseFloat(d.negPrice):price(); }
  else { if(!$('#kg'))return; d.kg=$('#kg').value; kg=parseFloat(d.kg)||0; }
  if($('#amt'))$('#amt').textContent=money(Math.round(kg*unit));
  const member=isThree(d.type)&&(d.bajajStatus==='Member'||d.bajajType==='TVS King Bajaj');
  if($('#ptsLine'))$('#ptsLine').textContent = d.industrial ? ('Qty '+kg.toFixed(2)+' kg · '+money(Math.round(kg*unit))+(unit!==price()?' · negotiated':'')) : (member?('⭐ Points to award: '+(kg*pts()).toFixed(2)):(money(price())+' / kg')); }
function setPay(p){ captureForm(); state.draft.pay=p; renderForm(); }
function setNoz(n,i){ state.draft.nozzle=n; document.querySelectorAll('#grNoz .chip').forEach((c,j)=>c.classList.toggle('on',j===i)); }
function toggleDenied(){ captureForm(); state.draft.denied=!state.draft.denied; renderForm(); }

function submitTxn(){ captureForm(); const d=state.draft; const plate=(d.plate||'').trim().toUpperCase();
  if(!plate){toast('⚠️ Scan or enter the Vehicle Plate Number');return;}
  if(!validPlate(plate)){toast('⚠️ Plate format invalid');updatePlateStatus();return;}
  if(!d.type){toast('⚠️ Vehicle type not detected');return;}
  if(isThree(d.type)){ if(!d.bajajStatus){toast('⚠️ Select Bajaj Status');return;} if(d.bajajStatus==='Not member'&&!d.bajajType){toast('⚠️ Select Bajaj Type');return;} }
  if(!d.permit){toast('⚠️ Select Refill Permit Status');return;}
  d.plate=plate;
  if(d.denied){ d.kg='0'; save(d); return; }
  let kg;
  if(d.industrial){
    const ms=parseFloat(d.meterStart)||0, me=parseFloat(d.meterEnd)||0;
    if(me<=ms){toast('⚠️ Meter end must be greater than meter start');return;}
    kg=+(me-ms).toFixed(2); if(kg<=0){toast('⚠️ Metered quantity must be > 0');return;}
    d.kg=String(kg);
  } else {
    kg=parseFloat(d.kg)||0;
    if(kg<KG_MIN||kg>KG_MAX){toast('⚠️ CNG must be '+KG_MIN+'–'+KG_MAX+' kg');return;}
    d.kg=String(kg);
  }
  if(!d.pay){toast('⚠️ Select payment method');return;}
  if(d.pay==='Mobile Money'&&!d.provider){toast('⚠️ Select mobile money provider');return;}
  if(d.pay==='Account (Credit)'&&!(d.customerAccount||'').trim()){toast('⚠️ Enter the customer / account name for credit sales');return;}
  if(!d.nozzle){toast('⚠️ Select a nozzle');return;}
  const dup=state.txns.find(x=>x.plate===plate&&x.status==='Completed'&&x.date===state.shiftDate&&x.shift===state.shift);
  if(dup&&!d._confirmedDup){ return dupPrompt(dup); }
  save(d);
}
function dupPrompt(dup){ $('#appBody').innerHTML=`<div class="fade"><h3 class="sec">Duplicate check</h3>
    <div class="banner warn"><span class="b">⚠️</span><div><b>VEHICLE ALREADY SERVED</b> this shift.</div></div>
    <div class="card"><div class="kv"><span class="l">Vehicle</span><b>${dup.plate}</b></div><div class="kv"><span class="l">Time</span><b>${dup.time}</b></div><div class="kv"><span class="l">CNG</span><b>${dup.kg.toFixed(2)} kg</b></div></div>
    <p class="tiny muted center">Same vehicle may refill again (extra transaction, same unique vehicle). Continue?</p>
    <div class="grid2" style="margin-top:6px"><button class="btn ghost sm" onclick="renderForm()">Cancel</button><button class="btn amber sm" onclick="state.draft._confirmedDup=true;submitTxn()">Continue</button></div></div>`; }

function save(d){ state.seq++;
  // TVS King registration → create membership on submit
  if(!d.denied && isThree(d.type) && d.bajajStatus==='Not member' && d.bajajType==='TVS King Bajaj' && !d.membershipId){ d.membershipId=newMembershipId(); d.bajajStatus='Member'; }
  if(isThree(d.type) && d.bajajStatus==='Member' && !d.membershipId){ d.membershipId=newMembershipId(); }
  const rec=buildRec({ companyId:state.company.id, stationId:state.station.id, date:state.shiftDate, time:clock(), att:state.attendant, shift:state.shift,
    plate:d.plate, type:d.type, kg:d.kg, pay:d.pay, prov:d.provider, noz:d.nozzle, permit:d.permit, denied:d.denied,
    reason:d.denied?'No Valid Permit – Not Refilled':'', remarks:d.remarks,
    bajajStatus:d.bajajStatus, bajajType:d.bajajType, membershipId:d.membershipId, driver:d.driver, phone:d.phone,
    mode:d.industrial?'Industrial':'Retail', meterStart:d.meterStart, meterEnd:d.meterEnd, pressure:d.pressure, temperature:d.temperature,
    negPrice:d.negPrice, customerAccount:d.customerAccount, trailerId:d.trailerId, photos:(d.photos&&d.photos.length?d.photos:(d.photo?[d.photo]:[])), confirmed:d.confirmed, confirmedBy:d.confirmedBy, rfid:d.rfid,
    method:d.scanned?'ANPR/OCR':'Manual', conf:d.conf });
  rec.syncStatus=SYNC.PENDING; rec.syncAt=null;         // saved locally, not yet synced
  state.txns.push(rec); bumpData(); state.draft=null; state.view='success'; screenSuccess(rec);
  scheduleSync(rec);                                     // auto-sync to central (no manual upload)
}
function clock(){ const n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0'); } // HH:MM:SS from device

function screenSuccess(rec){ const denied=rec.denied;
  $('#appBody').innerHTML=`<div class="fade" style="padding-top:16px">
    <div class="center"><div style="width:76px;height:76px;border-radius:50%;background:${denied?'#fef3c7':'var(--green-l)'};display:grid;place-items:center;margin:0 auto;font-size:38px">${denied?'🚫':'✓'}</div>
      <h3 style="color:${denied?'#B45309':'var(--green-d)'};margin:14px 0 2px">${denied?'Recorded — not refilled':'Transaction saved'}</h3>
      <div class="tiny muted">Saved to Day Sales + Sales History</div></div>
    ${rec.photo?`<div class="cam" style="height:104px;margin-top:14px"><img src="${rec.photo}" class="camimg"></div>`:''}
    <div class="card" style="margin-top:14px">
      <div class="kv"><span class="l">Transaction ID</span><b style="font-family:monospace">${rec.id}</b></div>
      <div class="kv"><span class="l">Date · time (device)</span><b>${rec.date} · ${rec.time}</b></div>
      <div class="kv"><span class="l">Vehicle</span><b>${rec.plate} · ${typeShort(rec.type)}</b></div>
      ${rec.driver?`<div class="kv"><span class="l">Driver</span><b>${rec.driver}${rec.phone?' · '+rec.phone:''}</b></div>`:''}
      ${isThree(rec.type)?`<div class="kv"><span class="l">Loyalty</span><b>${rec.loyaltyStatus}${rec.membershipId?' · '+rec.membershipId:''}${rec.bajajType?' · '+rec.bajajType:''}</b></div>`:''}
      <div class="kv"><span class="l">Permit status</span><b>${rec.permit}</b></div>
      <div class="kv"><span class="l">Sync status</span><b id="succSync_${rec.id}">${syncBadge(rec.syncStatus)}</b></div>
      <div class="kv"><span class="l">CNG quantity</span><b>${rec.kg.toFixed(2)} kg</b></div>
      ${denied?`<div class="kv"><span class="l">Reason</span><b style="color:var(--amber)">${rec.reason}</b></div>`:`
      <div class="kv"><span class="l">Amount</span><b style="color:var(--green-d)">${money(rec.amount)}</b></div>

      ${rec.points?`<div class="kv"><span class="l">⭐ Loyalty points</span><b style="color:var(--amber)">+${rec.points}</b></div>`:''}`}
    </div>

    <button class="btn primary" style="margin-top:8px" onclick="startTxn()">＋  Next vehicle</button>
    <button class="btn ghost sm" style="margin-top:8px" onclick="nav('home')">Back to shift</button></div>`;
  toast(`<span class="big">${denied?'🚫':'✓'}</span> ${rec.id} saved${rec.points?' · +'+rec.points+'pt':''}`);
}

/* ================= SHIFT CLOSE ================= */
function renderClose(){ const m=metrics(mine()); const starts={'Nozzle 1':10420.0,'Nozzle 2':8890.5,'Nozzle 3':7714.0,'Nozzle 4':6002.0}; const perNoz={}; state.nozzles.forEach(n=>perNoz[n]=0); mine().filter(x=>!x.denied).forEach(x=>perNoz[x.nozzle]=(perNoz[x.nozzle]||0)+x.kg);
  $('#appBody').innerHTML=`<div class="fade"><h3 class="sec">Close shift · nozzle readings</h3>
    <div class="banner ok"><span class="b">ℹ️</span><div>Enter each nozzle end reading. Dispensed = end − start.</div></div>
    <div class="card">${state.nozzles.map(n=>{const st=starts[n];const sug=(st+(perNoz[n]||0)).toFixed(1);return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>${n}</span><span class="muted tiny" style="font-weight:600">start ${st.toFixed(1)}</span></div><div class="grid2" style="margin-top:6px"><input class="txt" data-start="${st}" id="end_${n.replace(' ','_')}" value="${sug}" inputmode="decimal" oninput="recon()"><div class="chip" id="disp_${n.replace(' ','_')}" style="border-color:var(--green-l);color:var(--green-d)">— kg</div></div></div>`;}).join('')}</div>
    <div class="card" id="reconCard"></div>
    <button class="btn dark" onclick="confirmClose()">Confirm shift closing</button>
    <p class="tiny muted center" style="margin-top:8px">Once confirmed the shift is locked.</p></div>`; recon();
}
function recon(){ const m=metrics(mine()); let totalNoz=0; state.nozzles.forEach(n=>{const el=$('#end_'+n.replace(' ','_'));if(!el)return;const st=parseFloat(el.getAttribute('data-start'));let end=parseFloat(el.value);const disp=(isNaN(end)?0:end)-st;const chip=$('#disp_'+n.replace(' ','_'));if(!isNaN(end)&&end<st){chip.textContent='end < start';chip.style.color='var(--red)';}else{chip.textContent=(disp>0?disp.toFixed(1):'0.0')+' kg';chip.style.color='var(--green-d)';totalNoz+=Math.max(0,disp);}});
  const varr=totalNoz-m.kg;const pct=totalNoz?(varr/totalNoz*100):0;const over=Math.abs(pct)>2;
  $('#reconCard').innerHTML=`<div class="rowb"><span>Total nozzle dispensed</span><b>${totalNoz.toFixed(1)} kg</b></div><div class="rowb"><span>Total transaction CNG</span><b>${m.kg.toFixed(1)} kg</b></div><div class="rowb"><span>Variance</span><b style="color:${over?'var(--red)':'var(--green-d)'}">${varr>=0?'+':''}${varr.toFixed(1)} kg (${pct.toFixed(1)}%)</b></div><div style="margin-top:8px">${over?'<span class="pill bad">⚑ Attention — nozzle variance</span>':'<span class="pill ok">✓ Within 2% tolerance</span>'}</div>`; }
function confirmClose(){ const bad=state.nozzles.some(n=>{const el=$('#end_'+n.replace(' ','_'));const st=parseFloat(el.getAttribute('data-start'));return parseFloat(el.value)<st;}); if(bad){toast('⚠️ A nozzle end reading is below its start');return;} const m=metrics(mine());
  $('#appBody').innerHTML=`<div class="fade" style="padding-top:16px"><div class="center"><div style="width:74px;height:74px;border-radius:50%;background:var(--green-l);display:grid;place-items:center;margin:0 auto;font-size:38px">🔒</div><h3 style="color:var(--green-d);margin:14px 0 2px">Shift closed & locked</h3><div class="tiny muted">${state.shift} shift (start ${state.shiftStart}) · ${state.attendant} · ${state.shiftDate}</div></div>
    <div class="card" style="margin-top:14px"><div class="kv"><span class="l">Served</span><b>${m.n} (${m.twN} 3W · ${m.fwN} 4W)</b></div><div class="kv"><span class="l">Total CNG</span><b>${m.kg.toFixed(1)} kg</b></div><div class="kv"><span class="l">Loyalty points</span><b>${m.pointsAwarded.toFixed(0)}</b></div><div class="kv"><span class="l">Total sales</span><b style="color:var(--green-d)">${money(m.sales)}</b></div></div>
    <div class="banner ok"><span class="b">✓</span><div>Summary sent to Station Manager. Day sales & history updated.</div></div>
    <button class="btn ghost" onclick="nav('home')">Back to shift</button></div>`;
  if($('#shiftClock'))$('#shiftClock').textContent='Locked 🔒'; toast('<span class="big">🔒</span> Shift closed and locked');
}

/* ================= EXPORT ================= */
function exportRowsCSV(arr){
  const head=['Company','Station','TransactionID','Date','Time','Shift','ShiftStart','Attendant','Driver','Phone','VehicleReg','VehicleType','Mode','MeterStart','MeterEnd','Pressure','Temperature','CustomerAccount','TrailerSkid','BajajStatus','BajajType','LoyaltyStatus','MembershipID','LoyaltyPoints','PermitStatus','CNG_kg','UnitPrice','SalesValue','PaymentMethod','Provider','Negotiated','Confirmed','ConfirmedBy','ReasonZeroKg','Remarks','EntryMethod','Status','SyncStatus','Source','TxType','RFID','PaymentStatus','POSRef','VFDStatus','ReceiptNo'];
  const lines=[head.join(',')];
  arr.forEach(x=>{ const row=[companyById(x.companyId).name,x.stationId,x.id,x.date,x.time,x.shift,x.shiftStart,x.attendant,x.driver||'',x.phone||'',x.plate,x.type,x.mode||'Retail',x.meterStart||'',x.meterEnd||'',x.pressure||'',x.temperature||'',x.customerAccount||'',x.trailerId||'',x.bajajStatus||'',x.bajajType||'',x.loyaltyStatus,x.membershipId||'',x.points||0,x.permit,x.kg.toFixed(2),x.unitPrice,x.amount,(x.pay==='Mobile Money'?'Mobile Money':x.pay),x.provider||'',x.negotiated?'Yes':'',x.confirmed?'Yes':'',x.confirmedBy||'',x.reason||'',x.remarks||'',x.method,x.status,x.syncStatus,x.source||'',x.txType||'',x.rfid||'',x.paymentStatus||'',x.posRef||'',x.vfdStatus||'',x.receiptNo||''];
    lines.push(row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')); });
  return lines.join('\n');
}
function exportCSV(arr,label){ dl('data:text/csv;charset=utf-8,'+encodeURIComponent(exportRowsCSV(arr||[])),'CNG_'+(label||'export')+'_'+state.shiftDate+'.csv'); toast('⬇ Exported '+(arr?arr.length:0)+' records'); }
function savePhoto(id){const x=state.txns.find(t=>t.id===id);if(!x||!x.photo){toast('No photo on this record');return;}dl(x.photo,x.id+'_'+x.plate.replace(/ /g,'')+'.jpg');toast('⬇ Saved '+x.plate);}
function saveAllPhotos(){const w=state.txns.filter(x=>x.photo);if(!w.length){toast('No captured photos yet');return;}w.forEach((x,i)=>setTimeout(()=>savePhoto(x.id),i*400));}

function applyFilter(arr){ const f=state.filter; const q=(f.q||'').replace(/ /g,'').toUpperCase();
  return completed(arr).filter(inTenant).filter(x=>
    (f.date==='All'||x.date===f.date) && (f.attendant==='All'||x.attendant===f.attendant) &&
    (f.shift==='All'||x.shift===f.shift) && (f.type==='All'||x.type===f.type) &&
    (f.payment==='All'||channel(x)===f.payment) && (f.permit==='All'||x.permit===f.permit) &&
    (f.bajaj==='All'||x.bajajType===f.bajaj) && (f.loyalty==='All'||x.loyaltyStatus===f.loyalty) &&
    (!q || (x.plate+ (x.membershipId||'') + (x.driver||'') + (x.phone||'')).replace(/ /g,'').toUpperCase().includes(q))
  );
}
function mtable(headers, rows, aligns){ const th=headers.map((h,i)=>`<th style="text-align:${aligns&&aligns[i]||'left'};padding:6px 6px;border-bottom:2px solid #e5e7eb;color:#6B7280">${h}</th>`).join(''); const tr=rows.map(r=>`<tr>${r.map((c,i)=>`<td style="text-align:${aligns&&aligns[i]||'left'};padding:6px 6px;border-bottom:1px solid #f1f5f9">${c}</td>`).join('')}</tr>`).join(''); return `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11.5px"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`; }
function optionList(sel, values, labels){ return values.map((v,i)=>`<option value="${v}"${sel===v?' selected':''}>${labels?labels[i]:v}</option>`).join(''); }
function renderMgr(){ stopFocalLive(); state.view='dashboard'; const all=completed(scopeTxns()); const dates=['All',...Array.from(new Set(all.map(x=>x.date)))]; const atts=['All',...Array.from(new Set(all.map(x=>x.attendant)))]; const f=state.filter;
  const fil=applyFilter(state.txns); const m=metrics(fil); const pc=permitCounts(fil); const totalSales=m.sales||1;
  const payRows=PAY_CHANNELS.map(ch=>{const set=m.refilled.filter(x=>channel(x)===ch);const s=sum(set,x=>x.amount),kg=sum(set,x=>x.kg);return [ch,set.length,kg.toFixed(1),money(s),(s/totalSales*100).toFixed(1)+'%'];}); payRows.push([`<b>Total</b>`,`<b>${m.refilled.length}</b>`,`<b>${m.kg.toFixed(1)}</b>`,`<b>${money(m.sales)}</b>`,'<b>100%</b>']);
  const attList=Array.from(new Set(fil.map(x=>x.attendant))); const attRows=attList.map(a=>{const mm=metrics(fil.filter(x=>x.attendant===a));return [a,mm.n,mm.kg.toFixed(1),money(mm.sales),mm.pointsAwarded.toFixed(0),mm.deniedN];});
  const keys=Array.from(new Set(fil.map(x=>x.attendant+'|'+x.shift+'|'+x.date))); const shiftRows=keys.map(k=>{const [a,sh,dt]=k.split('|');const set=fil.filter(x=>x.attendant===a&&x.shift===sh&&x.date===dt);const mm=metrics(set);const start=(set[0]&&set[0].shiftStart)||'';return [a,`${sh}<div class="tiny muted">${dt} · ${start}</div>`,mm.total,mm.kg.toFixed(1),money(mm.sales),mm.twN,mm.fwN,mm.membersServed,mm.pointsAwarded.toFixed(0),mm.deniedN];});
  const denRows=m.denied.map(x=>[x.plate,typeShort(x.type),x.date,x.time,x.attendant,x.shift,x.permit,x.reason]);
  const permitRows=PERMITS.map(p=>[p,pc[p]||0, permitOK(p)?'<span class="pill ok">OK</span>':'<span class="pill bad">Issue</span>']);
  $('#appBody').innerHTML=`<div class="fade"><h3 class="sec">Station Manager Dashboard</h3>
    <div class="banner ok" style="background:#ecfdf5;border-color:#a7f3d0"><span class="b">🟢</span><div><b id="liveStamp">System Status: 🟢 Live · Connected · ${clock()}</b><div class="tiny muted">Last data update: ${state.central.lastSync||'—'} · updates automatically — no manual refresh needed.</div></div></div>

    </div>
    <div class="grid2" style="margin-bottom:6px">
      <button class="btn ghost sm" onclick="renderGasRecon()">🛢️ Gas reconciliation</button>
      <button class="btn ghost sm" onclick="renderModules()">📦 Modules</button>
    </div>
    <div class="grid2" style="margin-bottom:6px">
      <button class="btn ghost sm" onclick="renderUsers()">👥 User management</button>
      <button class="btn ghost sm" onclick="renderSettings()">⚙️ Settings</button>
    </div>
    <div class="grid2" style="margin-bottom:6px">
      <button class="btn dark sm" onclick="renderFocal()">🛰️ Real-Time Focal Point</button>
      <button class="btn ghost sm" onclick="renderHealth()">🔌 Integration health</button>
    </div>
    <div class="grid2" style="margin-bottom:10px">

        <select class="txt sel" onchange="state.filter.date=this.value;renderMgr()">${optionList(f.date,dates)}</select>
        <select class="txt sel" onchange="state.filter.attendant=this.value;renderMgr()">${optionList(f.attendant,atts)}</select>
        <select class="txt sel" onchange="state.filter.shift=this.value;renderMgr()">${optionList(f.shift,['All','Day','Night'])}</select>
        <select class="txt sel" onchange="state.filter.type=this.value;renderMgr()">${optionList(f.type,['All','Four-Wheeler','Three-Wheeler'],['All types','4-Wheeler','3-Wheeler'])}</select>
        <select class="txt sel" onchange="state.filter.payment=this.value;renderMgr()">${optionList(f.payment,['All',...PAY_CHANNELS])}</select>
        <select class="txt sel" onchange="state.filter.permit=this.value;renderMgr()">${optionList(f.permit,['All',...PERMITS])}</select>
        <select class="txt sel" onchange="state.filter.bajaj=this.value;renderMgr()">${optionList(f.bajaj,['All',...BAJAJ_TYPES],['All bajaj','TVS King','Other'])}</select>
        <select class="txt sel" onchange="state.filter.loyalty=this.value;renderMgr()">${optionList(f.loyalty,['All','Member','Non-member'],['All loyalty','Members','Non-members'])}</select>
      </div>
      <input class="txt" id="mgrSearch" style="margin-top:8px" placeholder="Search plate / membership / driver / phone" value="${f.q}" oninput="state.filter.q=this.value;state._sf=true;renderMgr()">

      <div class="rowb"><span>3W / 4W served</span><b>${m.twN} / ${m.fwN}</b></div><div class="rowb"><span>Members · points</span><b>${m.membersServed} · ${m.pointsAwarded.toFixed(0)}</b></div>
      <div class="rowb"><span>Zero-kg / no-permit</span><b style="color:var(--amber)">${m.deniedN}</b></div><div class="rowb"><span>Avg kg/txn · avg value</span><b>${m.avgKg.toFixed(1)} · ${money(m.avgVal)}</b></div></div>
    <div class="card" style="border-color:#bfdbfe;background:#eff6ff">
      <div class="sec" style="margin:0 0 8px;color:#1D4E89">🛰️ Data synchronization status</div>

      ${failedList()}

    </div>
    <p class="tiny muted center" style="margin-top:6px">Showing ${fil.length} of ${all.length} transactions · one source of truth (Attendant → central → Manager).</p></div>`;
  state.lastRenderVersion=state.dataVersion; startMgrLive();
  if(state._sf){ const si=$('#mgrSearch'); if(si){ si.focus(); const v=si.value; si.setSelectionRange(v.length,v.length); } state._sf=false; }
}

  if(!bad.length) return '<div class="tiny" style="color:var(--green-d);margin-top:6px">✓ All attendant transactions are synchronized — nothing missing or pending.</div>';
