<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Gas CNG · Digital Attendant Prototype</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B7A3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Energy Station">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --green:#1B7A3D; --green-d:#14532D; --green-l:#E6F4EA; --green-ll:#F4FAF6;
    --amber:#B45309; --amber-l:#FEF3C7; --red:#B91C1C; --red-l:#FEE2E2;
    --ink:#1F2937; --muted:#6B7280; --line:#E5E7EB; --white:#fff;
    --blue:#1D4E89;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0f172a;color:var(--ink);
    display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start;padding:28px 14px;min-height:100vh}
  .stage{display:flex;flex-direction:column;align-items:center;gap:14px}
  .stage h2{color:#e2e8f0;font-size:14px;font-weight:600;margin:0;letter-spacing:.3px}
  .stage p.sub{color:#94a3b8;font-size:12px;margin:0 0 2px;max-width:360px;text-align:center}

  .phone{width:378px;height:772px;background:#000;border-radius:44px;padding:12px;box-shadow:0 30px 70px rgba(0,0,0,.55);position:relative}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#000;border-radius:0 0 18px 18px;z-index:40}
  .screen{width:100%;height:100%;background:#F7F9F8;border-radius:33px;overflow:hidden;position:relative;display:flex;flex-direction:column}

  .topbar{background:linear-gradient(135deg,var(--green) 0%,var(--green-d) 100%);color:#fff;padding:34px 18px 14px;flex-shrink:0}
  .topbar .row{display:flex;justify-content:space-between;align-items:center}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
  .logo{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--green);display:grid;place-items:center;font-weight:800;font-size:14px}
  .who{font-size:11px;opacity:.9;text-align:right;line-height:1.35}
  .who b{display:block;font-size:12px}
  .shiftchip{margin-top:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:12px;
    padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
  .shiftchip .dot{width:8px;height:8px;border-radius:50%;background:#86efac;display:inline-block;margin-right:6px;box-shadow:0 0 0 3px rgba(134,239,172,.3)}

  .body{flex:1;overflow-y:auto;padding:16px 16px 90px}
  .body::-webkit-scrollbar{width:0}

  .nav{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 6px 16px;flex-shrink:0;z-index:30}
  .nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;flex:1}
  .nav button .ic{font-size:19px;line-height:1}
  .nav button.on{color:var(--green)}
  .fab{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;display:grid;place-items:center;font-size:26px;margin-top:-24px;box-shadow:0 14px 28px rgba(27,122,61,.35)}
  .fab:active{transform:scale(.96)}

  h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:4px 0 10px;font-weight:700}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.primary{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;box-shadow:0 6px 14px rgba(27,122,61,.35)}
  .btn.dark{background:var(--green-d);color:#fff}
  .btn.ghost{background:#fff;color:var(--green);border:2px solid var(--green)}
  .btn.amber{background:var(--amber);color:#fff}
  .btn.red{background:#fff;color:var(--red);border:2px solid var(--red)}
  .btn.sm{padding:11px;font-size:14px;border-radius:12px}
  .btn:active{transform:scale(.98)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  label.fl{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:2px 0 7px;text-transform:uppercase;letter-spacing:.4px}
  input.big{width:100%;border:2px solid var(--line);border-radius:13px;padding:14px;font-size:22px;font-weight:700;color:var(--ink);text-align:center;outline:none}
  input.big:focus{border-color:var(--green)}
  input.txt{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:15px;outline:none}
  input.txt:focus{border-color:var(--green)}
  select.sel{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px;font-size:15px;font-weight:600;color:var(--ink);background:#fff;outline:none;-webkit-appearance:none;appearance:none}
  select.sel:focus{border-color:var(--green)}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:13px;padding:14px 8px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
  .seg button .ic{font-size:22px}
  .seg button.on{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:11px;padding:12px 4px;font-weight:700;font-size:14px;color:var(--muted);text-align:center;cursor:pointer}
  .chip.on{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
  .muted{color:var(--muted)}.tiny{font-size:11px}.center{text-align:center}
  .amt{font-size:34px;font-weight:800;color:var(--green-d);text-align:center;letter-spacing:-.5px}
  .rowb{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--green-ll);font-size:14px}
  .rowb:last-child{border-bottom:0}
  .rowb b{font-weight:700}
  .pill{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
  .pill.ok{background:var(--green-l);color:var(--green-d)}
  .pill.warn{background:var(--amber-l);color:var(--amber)}
  .pill.bad{background:var(--red-l);color:var(--red)}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}
  .kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
  .kpi .v{font-size:22px;font-weight:800;color:var(--green-d);margin-top:3px;line-height:1}
  .kpi .u{font-size:11px;color:var(--muted);font-weight:600}
  .kpi.wide{grid-column:1/3;background:linear-gradient(135deg,var(--green),var(--green-d));border:0;color:#fff}
  .kpi.wide .k{color:rgba(255,255,255,.85)}.kpi.wide .v{color:#fff;font-size:28px}.kpi.wide .u{color:rgba(255,255,255,.85)}

  .cam{background:#111827;border-radius:16px;height:210px;position:relative;overflow:hidden;display:grid;place-items:center;margin-bottom:12px}
  .cam .frame{position:absolute;inset:26px 30px;border:2px dashed rgba(255,255,255,.55);border-radius:10px}
  .cam .plate{background:#f8fafc;border:3px solid #111;border-radius:7px;padding:8px 16px;font-weight:800;font-size:26px;letter-spacing:2px;color:#111;box-shadow:0 4px 10px rgba(0,0,0,.4);transform:rotate(-2deg)}
  .cam .hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#cbd5e1;font-size:11px}
  .scan{position:absolute;left:30px;right:30px;height:2px;background:#86efac;box-shadow:0 0 10px #86efac;top:26px;animation:scan 1.1s ease-in-out infinite}
  @keyframes scan{0%{top:26px}50%{top:180px}100%{top:26px}}

  .txn{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--green-ll)}
  .txn:last-child{border-bottom:0}
  .txn .ico{width:38px;height:38px;border-radius:10px;background:var(--green-l);display:grid;place-items:center;font-size:19px;flex-shrink:0}
  .txn .mid{flex:1;min-width:0}
  .txn .mid b{font-size:14px}
  .txn .mid .m{font-size:11px;color:var(--muted)}
  .txn .amt2{font-weight:800;color:var(--green-d);font-size:14px;text-align:right}
  .txn .amt2 .m{font-size:10px;color:var(--muted);font-weight:600}

  .toast{position:absolute;left:14px;right:14px;bottom:78px;background:var(--green-d);color:#fff;border-radius:14px;padding:13px 15px;
    font-size:13px;font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.35);z-index:50;display:flex;gap:10px;align-items:center;
    opacity:0;transform:translateY(12px);transition:.28s;pointer-events:none}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast .big{font-size:20px}

  .banner{border-radius:13px;padding:12px 13px;font-size:13px;margin-bottom:12px;display:flex;gap:9px;align-items:flex-start}
  .banner.warn{background:var(--amber-l);color:#7c2d12;border:1px solid #fcd34d}
  .banner.ok{background:var(--green-l);color:var(--green-d);border:1px solid #bbf7d0}
  .banner .b{font-size:18px;line-height:1}
  .kv{font-size:13px;display:flex;justify-content:space-between;padding:4px 0}
  .kv .l{color:var(--muted)}
  .hidden{display:none}
  .stepdots{display:flex;gap:5px;justify-content:center;margin:0 0 12px}
  .stepdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .stepdots i.on{background:var(--green);width:20px;border-radius:5px}

  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .legend{max-width:380px;color:#94a3b8;font-size:11px;text-align:center;line-height:1.6}
  .legend b{color:#cbd5e1}
  .camimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0b1220;border-radius:16px}
  .thumb{width:46px;height:46px;border-radius:9px;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}

  @media (max-width:820px){
    body{padding:0;gap:0;background:var(--green-d);display:block}
    .stage{width:100%;gap:0;margin-bottom:0}
    .stage h2{background:var(--green-d);color:#dcfce7;width:100%;padding:9px 14px;font-size:12px;text-align:center;box-sizing:border-box}
    .stage p.sub,.legend{display:none}
    .phone{width:100%;height:calc(100vh - 34px);min-height:560px;border-radius:0;padding:0;box-shadow:none}
    .notch{display:none}
    .screen{border-radius:0;height:100%}
    .topbar{padding-top:16px}
    .body{padding-bottom:96px}
  }
  @media (max-width:820px) and (display-mode:standalone){
    .phone{height:100vh}
  }

  :root { --phone-w: 378px; }
  body { padding: 28px 14px; min-height: 100vh; }
  .stage { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .phone { width: min(92vw, var(--phone-w)); max-width: 100%; height: min(88vh, 772px); min-height: 620px; transition: width 0.2s ease, height 0.2s ease; }
  .screen { min-height: 100%; }
  @media (max-width: 820px) {
    body { padding: 0; background: var(--green-d); }
    .stage { width: 100%; gap: 0; }
    .stage h2 { width: 100%; padding: 9px 14px; box-sizing: border-box; }
    .phone { width: 100%; height: calc(100dvh - 34px); min-height: 560px; border-radius: 0; padding: 0; box-shadow: none; }
    .screen { border-radius: 0; height: 100%; }
    .topbar { padding-top: 16px; }
    .body { padding: 12px 12px 96px; }
  }
  @media (max-width: 560px) {
    .body { padding: 12px 10px 90px; }
    .card { padding: 12px; border-radius: 12px; }
    .btn { padding: 13px 10px; font-size: 14px; }
    .btn.sm { padding: 11px 8px; font-size: 13px; }
    .kpis { grid-template-columns: 1fr 1fr; }
    .grid2, .grid4 { grid-template-columns: 1fr; }
    .seg { flex-direction: column; }
    .nav { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .nav button { font-size: 9px; }
    .topbar .row { gap: 8px; }
    .brand { font-size: 13px; }
    .who { font-size: 10px; }
    .amt { font-size: 28px; }
    input.big { font-size: 20px; }
  }
  @media (max-width: 420px) {
    .phone { width: 100%; height: 100dvh; min-height: 100dvh; border-radius: 0; }
    .screen { border-radius: 0; }
    .topbar { padding: 18px 12px 12px; }
    .body { padding: 10px 8px 86px; }
    .kpis { grid-template-columns: 1fr; }
    .card { padding: 10px; }
    .btn { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="stage">
  <h2 id="stageCap">Green Gas CNG</h2>
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="topbar" id="topbar"></div>
      <div class="body" id="appBody"></div>
      <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(event)">
      <div class="nav" id="navbar"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
  <div class="legend" id="legend">Sign in as an Attendant to record refills, or as the Station Manager to view the live dashboard. Each role sees only its own screens.</div>
</div>

<script>
let PLATFORM_NAME = 'Energy Station Platform';
const COMPANIES = [
  { id:'C001', name:'Green Gas CNG', trading:'Green Gas', country:'Tanzania', currency:'TZS', color:'#1B7A3D', colorD:'#14532D', energyTypes:['CNG'], pricePerKg:1550, pointsPerKg:1,
    stations:[ {id:'S01',code:'GG-MAIN',name:'Main Station',status:'Active',color:'#1B7A3D',colorDark:'#14532D',logo:'GG',logoBg:'#E6F4EA'},
                {id:'S02',code:'GG-MIKO',name:'Mikocheni',status:'Active',color:'#0F766E',colorDark:'#115E59',logo:'MK',logoBg:'#DCFCE7'}],
    licences:[ {name:'EWURA Operating Licence', number:'EWURA/CNG/2024/012', issuer:'EWURA', issued:'2024-01-15', expiry:'2026-12-31', fileName:'ewura_licence.pdf', fileData:null},
                {name:'Fire Safety Certificate', number:'FIRE/2025/220', issuer:'Fire & Rescue Force', issued:'2025-03-01', expiry:'2026-03-01', fileName:'fire_cert.pdf', fileData:null},
                {name:'Meter Calibration Certificate', number:'WMA/2025/44', issuer:'Weights & Measures Agency', issued:'2025-06-01', expiry:'2026-06-01', fileName:'meter_cal.pdf', fileData:null},
                {name:'Business Licence', number:'BRELA/2024/9981', issuer:'BRELA', issued:'2024-01-10', expiry:'2027-01-10', fileName:'', fileData:null} ],
    defaultBranding:{logo:'GG', logoBg:'#E6F4EA'} },
  { id:'C002', name:'BlueFuel Energy', trading:'BlueFuel', country:'Tanzania', currency:'TZS', color:'#1D4E89', colorD:'#0f2f57', energyTypes:['CNG','LNG'], pricePerKg:1600, pointsPerKg:2,
    stations:[ {id:'S01',code:'BF-DOD',name:'Dodoma 01',status:'Active',color:'#1D4E89',colorDark:'#0f2f57',logo:'BF',logoBg:'#DBEAFE'} ],
    licences:[ {name:'EWURA Operating Licence', number:'EWURA/CNG/2025/077', issuer:'EWURA', issued:'2025-02-01', expiry:'2027-02-01', fileName:'', fileData:null} ],
    defaultBranding:{logo:'BF', logoBg:'#DBEAFE'} }
];

const MODULES = [
  { key: 'dashboard', label: 'Dashboard', status: 'Active', enabled: true },
  { key: 'home', label: 'Home', status: 'Active', enabled: true },
  { key: 'settings', label: 'Settings', status: 'Active', enabled: true },
  { key: 'recon', label: 'Reconciliation', status: 'Active', enabled: true },
  { key: 'gas', label: 'Gas', status: 'Active', enabled: true },
  { key: 'billing', label: 'Billing', status: 'Active', enabled: true }
];

const moduleIsActive = (module) => module && (module.enabled !== false) && (module.status !== 'Inactive') && (module.status !== 'Disabled');

function companyById(id){ return COMPANIES.find(c=>c.id===id)||COMPANIES[0]; }
function mixWithWhite(hex, ratio) { hex=hex.replace('#',''); const num=parseInt(hex,16); const r=Math.round(((num>>16)&255)*ratio + 255*(1-ratio)); const g=Math.round(((num>>8)&255)*ratio + 255*(1-ratio)); const b=Math.round((num&255)*ratio + 255*(1-ratio)); return `rgb(${r}, ${g}, ${b})`; }
function shadeColor(hex, percent) { const num=parseInt(hex.slice(1),16); const amt=Math.round(2.55*percent); const r=Math.min(255,Math.max(0,(num>>16)+amt)); const g=Math.min(255,Math.max(0,((num>>8)&255)+amt)); const b=Math.min(255,Math.max(0,(num&255)+amt)); return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
function applyStationTheme(station) { const active = station || state.station; const color=active?.color||state.company?.color||'#1B7A3D'; const dark=active?.colorDark||state.company?.colorD||'#14532D'; document.documentElement.style.setProperty('--green', color); document.documentElement.style.setProperty('--green-d', dark); }
function getStationLogo(station, company){ const st=station||state.station; const c=company||state.company||COMPANIES[0]; const brand=st?.logo||c.defaultBranding?.logo||(c.name||'').slice(0,2).toUpperCase(); return brand; }
const ATTENDANTS=['Salha Mohamed Duge','Mary Aloyce Shio','Magreth Selemani Adamu','Sunday Alfred Mmanda','Rajabu Shija Rajabu','Rashid Haji Simtitu','Swaumu Abubakari Kidindi','Beatrice Nasiph','Asha Mussa','Moses Khamis'];
const SHIFTS=[{name:'Day',time:'08:00 – 18:30',start:'08:00',end:'18:30'},{name:'Night',time:'18:30 – 08:00',start:'18:30',end:'08:00'}];
const STATION_MANAGER='Erick Hussein Mshamu';
const MANAGER_PIN='1234';
const PROVIDERS=['Mixx by Yas','Airtel Money','Selcom','M-Pesa','HaloPesa','T-Pesa'];
const PAY_CHANNELS=['Cash',...PROVIDERS,'Account (Credit)'];
const PERMITS=['Active','Valid','Inactive','Invalid','Expired'];
const PERMIT_OK=['Active','Valid'];
const BAJAJ_TYPES=['TVS King Bajaj','Other Bajaj'];
const BULK_POSTS=['Bulk Post 1','Bulk Post 2'];
const KG_MIN=.5,KG_MAX=25;
const TODAY = new Date().toISOString().slice(0,10);
const SYNC={PENDING:'Pending Synchronization',SYNCING:'Synchronizing',SYNCED:'Synchronized',FAILED:'Synchronization Failed'};
function syncShort(s){return s.replace('Pending Synchronization','Pending sync').replace('Synchronizing','Syncing').replace('Synchronization Failed','Sync failed');}
function syncBadge(s){const cls={[SYNC.SYNCED]:'ok',[SYNC.PENDING]:'warn',[SYNC.SYNCING]:'warn',[SYNC.FAILED]:'bad'}[s]||'warn'; const ic={[SYNC.SYNCED]:'✓',[SYNC.PENDING]:'⟳',[SYNC.SYNCING]:'↻',[SYNC.FAILED]:'!'}[s]||'•'; return `<span class="pill ${cls}">${ic} ${syncShort(s)}</span>`;}
const state={ company:null, station:null, platformAdmin:false, role:null, attendant:ATTENDANTS[0], shift:'Day', shiftDate:TODAY, shiftStart:'08:00', shiftStarted:false, seq:0, memberSeq:2000, txns:[], users:[], currentUser:null, dataVersion:0, demoLive:false, mgrTimer:null, demoTimer:null, view:'login'};
function hashPw(s){ let h=5381; s=String(s); for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return 'h'+((h>>>0).toString(16)); }
(function seedUsers(){ const mk=(o)=>{ o.passwordHash=hashPw(o.password||'1234'); delete o.password; o.status=o.status||'Active'; o.lastLogin=null; state.users.push(o); }; const uname=(name)=>{ return name.toLowerCase().replace(/\s+/g,'.'); }; const manager={username:uname(STATION_MANAGER), password:'1234', role:'Manager', companyId:'C001', stationId:'S01', name:STATION_MANAGER}; mk(manager); for(const company of COMPANIES){ for(const station of company.stations){ const admin={ username: `${company.trading.toLowerCase()}.${station.code.toLowerCase()}.admin`, password:'1234', role:'Administrator', companyId:company.id, stationId:station.id, name:`${company.trading} Admin`}; mk(admin); } } })();
function newMembershipId(){ state.memberSeq++; return 'GG-'+state.memberSeq; }
function classify(p){ const s=(p||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(s.startsWith('MC')) return 'Three-Wheeler'; if(s.startsWith('T')) return 'Four-Wheeler'; return ''; }
const isThree = t => t === 'Three-Wheeler';
function typeShort(t){ return isThree(t)?'3-Wheeler':'4-Wheeler'; }

function buildRec(o){ const comp = companyById(o.companyId||'C001'); const type = o.type || classify(o.plate) || 'Four-Wheeler'; const denied = !!o.denied; const industrial = o.mode === 'Industrial'; return { id:(state.seq+1), ...o, companyId:o.companyId||'C001', stationId:o.stationId||'S01', type, denied, permit:o.permit||'Active', amount:(o.kg||0)*price(), paid:o.paid||0, syncStatus:SYNC.SYNCED, syncAt:nowStamp(), companyName:comp.name, color:comp.color, createdAt:Date.now() }; }

function toast(html,ms=2200){const t=$('#toast');if(!t)return;t.innerHTML=html;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms);}
function dl(href,name){const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove();}
function price(){ return state.company ? state.company.pricePerKg : 1550; }
function cur(){ return state.company ? state.company.currency : 'TZS'; }
function completed(arr){ return arr.filter(x=>x.status==='Completed'); }
function inTenant(x){ return state.company && x.companyId===state.company.id && (!state.station || x.stationId===state.station.id); }
function scopeTxns(){ return state.txns.filter(inTenant); }
function mine(){ return scopeTxns().filter(x=>x.attendant===state.attendant && x.shift===state.shift && x.date===state.shiftDate); }
function isMember(x){ return x.loyaltyStatus==='Member'; }
function metrics(arr){ const comp=completed(arr); const refilled=comp.filter(x=>!x.denied); const denied=comp.filter(x=>x.denied); const tw=refilled.filter(x=>isThree(x.type)), fw=refilled.filter(x=>!isThree(x.type)); return { sales:sum(refilled,x=>x.amount||x.kg*price()), cng:sum(refilled,x=>x.kg||0), txns:refilled.length, three:tw.length, four:fw.length, denied:denied.length, unique:uniq(refilled) }; }
function permitCounts(arr){ const c={}; PERMITS.forEach(p=>c[p]=0); completed(arr).forEach(x=>c[x.permit]=(c[x.permit]||0)+1); return c; }
function nowStamp(){ return state.shiftDate+' '+clock(); }
function commitToCentral(rec){ rec.syncStatus=SYNC.SYNCED; rec.syncAt=nowStamp(); state.central.lastSync=rec.syncAt; state.central.lastRec=rec; bumpData(); uiSyncTick(rec); }
function scheduleSync(rec){ setTimeout(()=>{ rec.syncStatus=SYNC.SYNCING; uiSyncTick(rec); setTimeout(()=>{ if(Math.random()<0.12){ rec.syncStatus=SYNC.FAILED; bumpData(); uiSyncTick(rec); setTimeout(()=>{ rec.syncStatus=SYNC.SYNCED; bumpData(); uiSyncTick(rec); },1200); } else { rec.syncStatus=SYNC.SYNCED; bumpData(); uiSyncTick(rec); } },1000); },50); }
function uiSyncTick(rec){ if($('#succSync_'+rec.id)) $('#succSync_'+rec.id).innerHTML=syncBadge(rec.syncStatus); if(state.role==='attendant' && state.view==='list') renderList(); if(state.role==='manager' && state.view==='dashboard') renderMgr(); }
function syncCounts(){ const c={}; Object.values(SYNC).forEach(s=>c[s]=0); scopeTxns().forEach(x=>{ c[x.syncStatus]=(c[x.syncStatus]||0)+1; }); return c; }
function activeAttendants(){ return new Set(completed(scopeTxns()).map(x=>x.attendant)).size; }
function syncPanelHTML(){ const c=syncCounts(); const pending=(c[SYNC.PENDING]||0)+(c[SYNC.SYNCING]||0); const last=state.central.lastRec; const failed=c[SYNC.FAILED]||0; return `<div class="card"><div class="kv"><span class="l">Network status</span><b>${pending?'Syncing':'Ready'}</b></div><div class="kv"><span class="l">Pending</span><b>${pending}</b></div><div class="kv"><span class="l">Failed</span><b>${failed}</b></div><div class="kv"><span class="l">Last sync</span><b>${last?last.syncAt:'--'}</b></div></div>`; }
function bumpData(){ state.dataVersion++; }
function startMgrLive(){ stopMgrLive(); state.mgrTimer=setInterval(()=>{ if(state.role!=='manager') return; const ls=$('#liveStamp'); if(ls) ls.textContent='System Status: 🟢 Live · Connected'; },4500); }
function stopMgrLive(){ if(state.mgrTimer){ clearInterval(state.mgrTimer); state.mgrTimer=null; } }
function syncAllData(){ toast('🔄 Synchronizing all data across all attendants…'); const scope=scopeTxns(); let n=0; scope.forEach(x=>{ if(x.syncStatus!==SYNC.SYNCED){ x.syncStatus=SYNC.SYNCING; n++; } }); if(n===0) toast('✅ All data already synchronized'); }
function toggleDemoLive(){ state.demoLive=!state.demoLive; if(state.demoLive){ startDemo(); toast('🟢 Live demo on — incoming sales will appear automatically'); } else { stopDemo(); toast('Live demo paused'); } }
function startDemo(){ stopDemo(); state.demoTimer=setInterval(()=>{ if(state.demoLive && state.role==='manager') injectRandomSale(); },5000); }

function rndL(){ const L='ABCDEFGHJKLMNPQRSTUVWXYZ'; return L[Math.floor(Math.random()*L.length)]+L[Math.floor(Math.random()*L.length)]+L[Math.floor(Math.random()*L.length)]; }
function injectRandomSale(){ state.seq++; const att=ATTENDANTS[Math.floor(Math.random()*5)]; const hr=new Date().getHours(); const shift=(hr>=8&&hr<18)?'Day':'Night'; const three=Math.random()<0.55; S({date:TODAY,time:new Date().toTimeString().slice(0,5),att,shift,plate:(three?'MC ':'T ')+rndL()+' '+rndL().slice(0,3),kg:(Math.random()*8+1.5).toFixed(1),pay:Math.random()<0.5?'Cash':'Mobile Money',prov:PROVIDERS[Math.floor(Math.random()*PROVIDERS.length)],noz:`Nozzle ${Math.floor(Math.random()*4)+1}`,permit:'Active'}); }

function openModule(k){ if(!state.company){ toast('Select a company first'); return; } if(k==='dashboard'){ renderMgr(); }

  else if(k==='gas'){ renderGas(); }
  else if(k==='billing'){ renderBilling(); }
  else if(k==='home'){ renderStart(); }

function doLogin(){ const un=($('#loginUser')?$('#loginUser').value:'').trim(); const pw=($('#loginPass')?$('#loginPass').value:''); const msg=$('#loginMsg'); const u=findUser(un); if(!u){ if(msg) msg.innerHTML='<span style="color:var(--red)">User not found for this company.</span>'; return; } if(hashPw(pw)!==u.passwordHash){ if(msg) msg.innerHTML='<span style="color:var(--red)">Incorrect password.</span>'; return; } state.currentUser=u; state.role=u.role; toast(`Welcome ${u.name}`); if(u.role==='Manager') renderMgr(); else if(u.role==='Administrator') renderAdmin(); else renderStart(); }

function renderBilling(){ $('#appBody').innerHTML='<div class="fade"><h3 class="sec">Billing</h3><div class="card">Billing module is active and ready.</div></div>'; }
function renderAdmin(){ state.view='admin'; refreshTop(); $('#navbar').innerHTML='<button class="on" onclick="renderAdmin()"><span class="ic">⚙️</span>Admin</button><button onclick="renderSettings()"><span class="ic">⚙️</span>Settings</button>'; $('#appBody').innerHTML=`<div class="fade"><h3 class="sec">Administration</h3><div class="card"><div class="kv"><span class="l">All modules</span><b>Enabled</b></div><div class="kv"><span class="l">System mode</span><b>Live</b></div></div></div>`; }
function renderMgr(){ state.view='dashboard'; refreshTop(); $('#navbar').innerHTML='<button class="on" onclick="renderMgr()"><span class="ic">▦</span>Dashboard</button><button onclick="renderSettings()"><span class="ic">⚙️</span>Settings</button>'; const m=metrics(scopeTxns()); $('#appBody').innerHTML=`<div class="fade"><h3 class="sec">Station Dashboard</h3><div class="kpis"><div class="kpi wide"><div class="k">Revenue</div><div class="v">${money(m.sales)}</div><div class="u">${m.txns} processed</div></div><div class="kpi"><div class="k">CNG</div><div class="v">${m.cng.toFixed(1)}</div><div class="u">kg</div></div><div class="kpi"><div class="k">3-Wheeler</div><div class="v">${m.three}</div><div class="u">sales</div></div><div class="kpi"><div class="k">4-Wheeler</div><div class="v">${m.four}</div><div class="u">sales</div></div><div class="kpi"><div class="k">Denied</div><div class="v">${m.denied}</div><div class="u">entries</div></div><div class="kpi"><div class="k">Unique</div><div class="v">${m.unique}</div><div class="u">vehicles</div></div></div><div class="card"><div class="kv"><span class="l">Modules</span><b>${MODULES.filter(moduleIsActive).length}/${MODULES.length}</b></div><div class="kv"><span class="l">Status</span><b>All active</b></div></div></div>`; }
function startApp(){ const appBody=$('#appBody'); if(!appBody){ return; }
  state.company=companyById('C001'); state.station=state.company.stations[0]; applyStationTheme(state.station); refreshTop(); renderLogin(); }
if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', startApp); } else { startApp(); }
</script>
</body>
