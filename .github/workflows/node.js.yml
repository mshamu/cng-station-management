name: Static Site CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required static app files exist
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          echo "Static app files are present."

      - name: Check that app files are not empty
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          echo "Static app files are populated."
